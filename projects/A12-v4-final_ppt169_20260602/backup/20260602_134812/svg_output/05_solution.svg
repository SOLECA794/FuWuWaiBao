<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#3A7BED"/></linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#3A7BED"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="55" y="30" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold" letter-spacing="1">泛雅 AI 智课</text>
  <rect x="55" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="195" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目背景</text>
  <rect x="345" y="45" width="280" height="32" rx="4" fill="#1E6FE0"/><text x="485" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">解决方案</text>
  <rect x="635" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="775" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">系统实现</text>
  <rect x="925" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="1065" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目总结</text>

  <text x="55" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" fill="#1D2433" font-weight="bold">一套底座，两端分工</text>
  <rect x="55" y="118" width="50" height="3" rx="1.5" fill="#0E8C80"/>
  <text x="55" y="140" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478">共享的AI能力平台 + 教师端与学生端两个独立应用入口</text>

  <!-- ===== VISUAL CORE: Base + Two Ends ===== -->
  <!-- Left: Teacher end -->
  <rect x="55" y="170" width="280" height="360" rx="12" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
  <rect x="55" y="170" width="280" height="56" rx="12" fill="#1E6FE0"/>
  <rect x="55" y="214" width="280" height="12" fill="#1E6FE0"/>
  <use data-icon="tabler-filled/user" x="85" y="188" width="22" height="22" fill="#FFFFFF"/>
  <text x="120" y="206" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">教师端</text>

  <text x="75" y="255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" font-weight="bold">专注：内容生产与发布</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478">
    <rect x="75" y="275" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="90" y="295">课件管理与AI自动解析</text>
    <rect x="75" y="315" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="90" y="335">结构化讲稿编辑与确认</text>
    <rect x="75" y="355" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="90" y="375">语音合成与内容发布</text>
    <rect x="75" y="395" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="90" y="415">学情看板与讲稿优化迭代</text>
  </g>
  <text x="75" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#1E6FE0">不关心学生端的问答细节</text>
  <text x="75" y="472" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#1E6FE0">只需关注内容质量和教学效果</text>

  <!-- Arrows from ends to base -->
  <line x1="335" y1="260" x2="375" y2="300" stroke="#1E6FE0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <defs><marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E6FE0"/></marker></defs>

  <!-- Center: Shared Base -->
  <rect x="390" y="200" width="500" height="300" rx="16" fill="url(#baseGrad)"/>
  <rect x="390" y="200" width="500" height="60" rx="16" fill="#0E8C80"/>
  <rect x="390" y="244" width="500" height="16" fill="#0E8C80"/>
  <text x="640" y="236" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">共享 AI 能力底座</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#FFFFFF">
    <rect x="410" y="275" width="220" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="520" y="296" text-anchor="middle" font-size="12" font-weight="bold">课件解析引擎</text>
    <text x="520" y="312" text-anchor="middle" font-size="10" fill-opacity="0.7">自动提取 → 结构化 → 节点化</text>
    <rect x="650" y="275" width="220" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="760" y="296" text-anchor="middle" font-size="12" font-weight="bold">智能问答引擎</text>
    <text x="760" y="312" text-anchor="middle" font-size="10" fill-opacity="0.7">上下文构建 → 课程检索 → 生成</text>
    <rect x="410" y="340" width="220" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="520" y="361" text-anchor="middle" font-size="12" font-weight="bold">语音合成引擎</text>
    <text x="520" y="377" text-anchor="middle" font-size="10" fill-opacity="0.7">文本转语音 → 音频内容对齐</text>
    <rect x="650" y="340" width="220" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="760" y="361" text-anchor="middle" font-size="12" font-weight="bold">学情数据分析</text>
    <text x="760" y="377" text-anchor="middle" font-size="10" fill-opacity="0.7">掌握度追踪 → 卡点识别 → 统计</text>
    <rect x="410" y="410" width="460" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="640" y="435" text-anchor="middle" font-size="12">数据底座：PostgreSQL + Redis + MinIO | 内容组织：节点化统一语言</text>
  </g>

  <!-- Arrows from base to student -->
  <line x1="890" y1="260" x2="930" y2="300" stroke="#0E8C80" stroke-width="2" marker-end="url(#arrTeal)"/>
  <defs><marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0E8C80"/></marker></defs>

  <!-- Right: Student end -->
  <rect x="945" y="170" width="280" height="360" rx="12" fill="#D6DEF5" stroke="#0E8C80" stroke-width="1.5"/>
  <rect x="945" y="170" width="280" height="56" rx="12" fill="#0E8C80"/>
  <rect x="945" y="214" width="280" height="12" fill="#0E8C80"/>
  <use data-icon="tabler-filled/user" x="975" y="188" width="22" height="22" fill="#FFFFFF"/>
  <text x="1010" y="206" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">学生端</text>

  <text x="965" y="255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" font-weight="bold">专注：学习与互动</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478">
    <rect x="965" y="275" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="980" y="295">课件播放与学习进度跟踪</text>
    <rect x="965" y="315" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="980" y="335">上下文问答（苏格拉底式）</text>
    <rect x="965" y="355" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="980" y="375">断点续学（三态续接）</text>
    <rect x="965" y="395" width="240" height="32" rx="6" fill="#FFFFFF"/>
    <text x="980" y="415">薄弱点检测与针对性练习</text>
  </g>
  <text x="965" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#0E8C80">不关心课件的制作过程</text>
  <text x="965" y="472" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#0E8C80">只需专注学习本身</text>

  <!-- Bottom: two key concepts -->
  <rect x="55" y="560" width="1170" height="100" rx="10" fill="#F4F7FC"/>
  <text x="640" y="585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" text-anchor="middle" font-weight="bold">为什么这样设计？</text>

  <rect x="80" y="600" width="540" height="42" rx="8" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
  <text x="100" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold">&#x2460; 一次解析，两端消费</text>
  <text x="100" y="636" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478">课件只需在底座中完成一次结构化解析，教师端用于编辑确认，学生端用于学习消费——同一份内容，两种使用场景</text>

  <rect x="650" y="600" width="560" height="42" rx="8" fill="#FFFFFF" stroke="#0E8C80" stroke-width="1"/>
  <text x="670" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#0E8C80" font-weight="bold">&#x2461; 职责分离，互不干扰</text>
  <text x="670" y="636" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478">教师端只为内容生产和学情分析负责；学生端只为学习体验和互动效果负责。两端共享底座能力，但不互相依赖对方的业务逻辑</text>

  <rect x="55" y="692" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="710" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="710" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">05</text>
</svg>
