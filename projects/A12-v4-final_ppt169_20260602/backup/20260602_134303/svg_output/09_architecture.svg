<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#1E6FE0"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#3A7BED"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B1FA2"/><stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37474F"/><stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0 Z" fill="#90CAF9"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1E6FE0" font-weight="bold" letter-spacing="1">系统架构</text>
  <text x="60" y="100" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" fill="#1D2433" font-weight="bold">核心架构：编排与能力分离，三层协同</text>
  <rect x="60" y="115" width="60" height="3" rx="1.5" fill="#0E8C80"/>

  <!-- Layer 1: Frontend -->
  <rect x="60" y="135" width="1160" height="70" rx="10" fill="url(#layer1)"/>
  <use data-icon="tabler-filled/device-desktop" x="85" y="155" width="18" height="18" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="115" y="168" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">前端交互层</text>
  <text x="115" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.8">Vue 3 + TypeScript</text>
  <rect x="260" y="150" width="200" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="360" y="176" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">(教师) 教师端</text>
  <rect x="480" y="150" width="200" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="580" y="176" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">(学生) 学生端</text>
  <rect x="700" y="150" width="250" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="825" y="176" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">[集成] 泛雅集成入口（OpenAPI）</text>
  <text x="1050" y="176" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.6">HTTPS/SSE</text>

  <!-- Arrow -->
  <line x1="640" y1="205" x2="640" y2="220" stroke="#90CAF9" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Layer 2: Orchestration -->
  <rect x="60" y="225" width="1160" height="140" rx="10" fill="url(#layer2)"/>
  <rect x="60" y="225" width="1160" height="10" rx="5" fill="#0E8C80" fill-opacity="0.6"/>
  <use data-icon="tabler-filled/adjustments" x="85" y="250" width="18" height="18" fill="#0E8C80"/>
  <text x="115" y="263" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">业务编排层</text>
  <text x="115" y="280" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#0E8C80" fill-opacity="0.9">&#9733; 编排层只做状态控制与流转，不承担AI推理</text>

  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#FFFFFF">
    <rect x="80" y="295" width="180" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="170" y="313" text-anchor="middle">学习状态机</text>
    <rect x="275" y="295" width="180" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="365" y="313" text-anchor="middle">SSE三事件协议</text>
    <rect x="470" y="295" width="180" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="560" y="313" text-anchor="middle">课件上传管道</text>
    <rect x="665" y="295" width="150" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="740" y="313" text-anchor="middle">任务调度引擎</text>
    <rect x="830" y="295" width="200" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="930" y="313" text-anchor="middle">OpenAPI兼容适配层</text>
  </g>
  <text x="80" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.6">Go后端 | 学习状态机：讲授&#8594;问答&#8594;三态续接&#8594;回讲 | SSE：token&#8594;sentence&#8594;final | 三级预览降级</text>

  <!-- Arrow -->
  <line x1="640" y1="365" x2="640" y2="380" stroke="#90CAF9" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Layer 3: AI -->
  <rect x="60" y="385" width="1160" height="140" rx="10" fill="url(#layer3)"/>
  <use data-icon="tabler-filled/code-circle" x="85" y="410" width="18" height="18" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="115" y="423" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">AI能力层</text>

  <!-- Sub-layers: Dify + Local -->
  <rect x="250" y="400" width="460" height="110" rx="8" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="480" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">主引擎：Dify 工作流编排</text>
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF">
    <rect x="265" y="435" width="85" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="307" y="452" text-anchor="middle">课件解析</text>
    <rect x="360" y="435" width="85" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="402" y="452" text-anchor="middle">知识入库</text>
    <rect x="455" y="435" width="85" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="497" y="452" text-anchor="middle">智能问答</text>
    <rect x="550" y="435" width="85" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="592" y="452" text-anchor="middle">脚本生成</text>
    <rect x="645" y="435" width="50" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
    <text x="670" y="452" text-anchor="middle">TTS</text>
  </g>

  <!-- Fallback arrow -->
  <path d="M710,450 L750,450 L750,480 L730,480" fill="none" stroke="#0E8C80" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="750" y="445" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#0E8C80">不可用&#8595;</text>

  <rect x="740" y="400" width="300" height="110" rx="8" fill="#E8EDF5" stroke="#0E8C80" stroke-width="1"/>
  <text x="890" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#0E8C80" text-anchor="middle" font-weight="bold">降级引擎：备用推理引擎</text>
  <text x="770" y="445" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#5A6478">三阶段解耦管线</text>
  <text x="770" y="460" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#5A6478">+ JSON Schema结构化约束</text>
  <text x="770" y="475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#5A6478">+ 苏格拉底式问答</text>
  <text x="770" y="495" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#0E8C80"></text>

  <!-- Arrow -->
  <line x1="640" y1="525" x2="640" y2="540" stroke="#90CAF9" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Layer 4: Data -->
  <rect x="60" y="545" width="1160" height="95" rx="10" fill="url(#layer4)"/>
  <use data-icon="tabler-filled/database" x="85" y="570" width="18" height="18" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="115" y="583" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">数据支撑层</text>

  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#FFFFFF">
    <rect x="260" y="560" width="280" height="65" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="400" y="580" text-anchor="middle" font-weight="bold">PostgreSQL</text>
    <text x="400" y="596" text-anchor="middle" font-size="10" fill-opacity="0.7">课程·节点·用户·学习记录·会话</text>
    <text x="400" y="612" text-anchor="middle" font-size="9" fill-opacity="0.5">关系型 | 事务一致 | JSONB扩展</text>

    <rect x="560" y="560" width="260" height="65" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="690" y="580" text-anchor="middle" font-weight="bold">Redis</text>
    <text x="690" y="596" text-anchor="middle" font-size="10" fill-opacity="0.7">会话状态·任务队列·进度游标·缓存</text>
    <text x="690" y="612" text-anchor="middle" font-size="9" fill-opacity="0.5">高吞吐 | 低延迟</text>

    <rect x="840" y="560" width="260" height="65" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="970" y="580" text-anchor="middle" font-weight="bold">MinIO</text>
    <text x="970" y="596" text-anchor="middle" font-size="10" fill-opacity="0.7">课件源文件·预览图·音频</text>
    <text x="970" y="612" text-anchor="middle" font-size="9" fill-opacity="0.5">S3兼容 | 私有化部署</text>
  </g>

  <rect x="60" y="680" width="1160" height="1" fill="#D0D7E2"/>
  <text x="60" y="700" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1220" y="700" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#9AA3B5" text-anchor="end">09</text>
</svg>
