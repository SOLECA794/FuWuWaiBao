<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#3A7BED"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="55" y="30" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold" letter-spacing="1">泛雅 AI 智课</text>
  <rect x="55" y="45" width="280" height="32" rx="4" fill="#1E6FE0"/><text x="195" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">项目背景</text>
  <rect x="345" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="485" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">解决方案</text>
  <rect x="635" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="775" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">系统实现</text>
  <rect x="925" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="1065" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目总结</text>

  <text x="55" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" fill="#1D2433" font-weight="bold">一份课件，能不能&#8220;秒变&#8221;智课？</text>
  <rect x="55" y="118" width="50" height="3" rx="1.5" fill="#0E8C80"/>

  <!-- Three question cards -->
  <rect x="55" y="150" width="370" height="240" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <circle cx="240" cy="185" r="28" fill="#DDE6FF"/>
  <text x="240" y="191" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" fill="#1E6FE0" text-anchor="middle" font-weight="bold">?</text>
  <text x="240" y="230" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#1D2433" text-anchor="middle" font-weight="bold">能不能让课件自己会讲？</text>
  <text x="240" y="260" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">教师上传课件后，自动生成</text>
  <text x="240" y="280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">结构化讲稿，而非逐字撰写</text>
  <text x="240" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#1E6FE0" text-anchor="middle">&#x2192; 传即生成讲稿</text>

  <rect x="460" y="150" width="370" height="240" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <circle cx="645" cy="185" r="28" fill="#D6DEF5"/>
  <text x="645" y="191" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" fill="#0E8C80" text-anchor="middle" font-weight="bold">?</text>
  <text x="645" y="230" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#1D2433" text-anchor="middle" font-weight="bold">能不能边学边问边溯源？</text>
  <text x="645" y="260" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">学生随时提问，系统基于当前</text>
  <text x="645" y="280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">课件内容给出引导式回答</text>
  <text x="645" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#0E8C80" text-anchor="middle">&#x2192; 问答秒级响应</text>

  <rect x="860" y="150" width="365" height="240" rx="12" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <circle cx="1042" cy="185" r="28" fill="#DDE6FF"/>
  <text x="1042" y="191" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" fill="#7B5BE0" text-anchor="middle" font-weight="bold">?</text>
  <text x="1042" y="230" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#1D2433" text-anchor="middle" font-weight="bold">能不能打断后自动续接？</text>
  <text x="1042" y="260" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">学习过程中断后，系统自动</text>
  <text x="1042" y="280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">判断理解程度并精确恢复</text>
  <text x="1042" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#7B5BE0" text-anchor="middle">&#x2192; 打断后自动续接</text>

  <!-- Bottom callout -->
  <rect x="55" y="430" width="1170" height="100" rx="10" fill="#F4F7FC"/>
  <text x="640" y="465" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#1D2433" text-anchor="middle" font-weight="bold">现实情况是&#8230;&#8230;（翻下一页）</text>
  <text x="640" y="495" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">现有的静态课件模式和通用AI方案，还无法很好地实现这三个目标</text>

  <rect x="55" y="570" width="1170" height="70" rx="10" fill="#1E6FE0" fill-opacity="0.08"/>
  <text x="640" y="600" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" text-anchor="middle" font-weight="bold">那么痛点在哪里？问题出在什么地方？</text>
  <text x="640" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478" text-anchor="middle">翻到下一页看分析 &#x2192;</text>

  <rect x="55" y="690" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">02</text>
</svg>
