<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#3A7BED"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A6478"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="55" y="30" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold" letter-spacing="1">泛雅 AI 智课</text>
  <rect x="55" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="195" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目背景</text>
  <rect x="345" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="485" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">解决方案</text>
  <rect x="635" y="45" width="280" height="32" rx="4" fill="#1E6FE0"/><text x="775" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">系统实现</text>
  <rect x="925" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="1065" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目总结</text>
  <text x="55" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" fill="#1D2433" font-weight="bold">学习状态机转换图</text>
  <rect x="55" y="118" width="50" height="3" rx="1.5" fill="#0E8C80"/>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <!-- Main state: LEARNING -->
    <rect x="100" y="160" width="200" height="70" rx="35" fill="#1E6FE0"/>
    <text x="200" y="200" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="bold">讲授中</text>
    <text x="200" y="218" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" font-size="10">节点级播放器</text>

    <line x1="300" y1="195" x2="350" y2="195" stroke="#5A6478" stroke-width="2" marker-end="url(#arr)"/>
    <text x="325" y="185" fill="#5A6478" text-anchor="middle" font-size="9">学生提问</text>

    <!-- QUESTIONING -->
    <rect x="360" y="160" width="200" height="70" rx="35" fill="#0E8C80"/>
    <text x="460" y="200" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="bold">问答中</text>
    <text x="460" y="218" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" font-size="10">SSE流式回答</text>

    <line x1="560" y1="195" x2="610" y2="195" stroke="#5A6478" stroke-width="2" marker-end="url(#arr)"/>
    <text x="585" y="185" fill="#5A6478" text-anchor="middle" font-size="9">回答完成</text>

    <!-- JUDGING -->
    <rect x="620" y="160" width="200" height="70" rx="35" fill="#E8553C"/>
    <text x="720" y="200" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="bold">判定中</text>
    <text x="720" y="218" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" font-size="10">理解程度分析</text>

    <!-- Three state branches -->
    <line x1="720" y1="230" x2="300" y2="370" stroke="#E8553C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="380" y="310" fill="#E8553C" font-size="10" font-weight="bold">none（未理解）</text>

    <line x1="720" y1="270" x2="720" y2="370" stroke="#0E8C80" stroke-width="2" marker-end="url(#arr)"/>
    <text x="740" y="330" fill="#0E8C80" font-size="10" font-weight="bold">partial（部分理解）</text>

    <line x1="820" y1="195" x2="1050" y2="195" stroke="#1E6FE0" stroke-width="2" marker-end="url(#arr)"/>
    <text x="935" y="185" fill="#1E6FE0" font-size="10" font-weight="bold">full（已理解）</text>

    <!-- RESUME: none -->
    <rect x="160" y="340" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#E8553C" stroke-width="2"/>
    <rect x="160" y="340" width="220" height="28" rx="12" fill="#E8553C"/>
    <rect x="160" y="360" width="220" height="8" fill="#E8553C"/>
    <text x="270" y="360" fill="#FFFFFF" text-anchor="middle" font-size="11" font-weight="bold">回退重讲</text>
    <text x="270" y="388" fill="#5A6478" text-anchor="middle" font-size="10">使用重讲脚本从头讲授</text>
    <text x="270" y="405" fill="#5A6478" text-anchor="middle" font-size="10">覆盖知识点全部内容</text>

    <line x1="270" y1="420" x2="200" y2="440" stroke="#5A6478" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="160" y="445" fill="#5A6478" font-size="9">回到讲授</text>

    <!-- RESUME: partial -->
    <rect x="610" y="340" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#0E8C80" stroke-width="2"/>
    <rect x="610" y="340" width="220" height="28" rx="12" fill="#0E8C80"/>
    <rect x="610" y="360" width="220" height="8" fill="#0E8C80"/>
    <text x="720" y="360" fill="#FFFFFF" text-anchor="middle" font-size="11" font-weight="bold">补充讲解</text>
    <text x="720" y="388" fill="#5A6478" text-anchor="middle" font-size="10">定位卡点段落补充</text>
    <text x="720" y="405" fill="#5A6478" text-anchor="middle" font-size="10">不重复已理解内容</text>

    <!-- RESUME: full -->
    <rect x="1050" y="160" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="2"/>
    <rect x="1050" y="160" width="180" height="28" rx="12" fill="#1E6FE0"/>
    <text x="1140" y="180" fill="#FFFFFF" text-anchor="middle" font-size="11" font-weight="bold">跳过继续</text>
    <text x="1140" y="208" fill="#5A6478" text-anchor="middle" font-size="10">下一节点正常推进</text>
    <text x="1140" y="222" fill="#5A6478" text-anchor="middle" font-size="10">学习主线不中断</text>

    <!-- INTERRUPT -->
    <rect x="80" y="480" width="160" height="50" rx="8" fill="#F4F7FC" stroke="#9AA3B5" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="160" y="507" fill="#5A6478" text-anchor="middle" font-size="11" font-weight="bold">&#x23F8; 打断/退出</text>
    <path d="M200,195 L40,195 L40,505 L80,505" fill="none" stroke="#9AA3B5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="60" y="250" fill="#9AA3B5" text-anchor="middle" font-size="9">随时发生</text>

    <line x1="240" y1="505" x2="350" y2="505" stroke="#5A6478" stroke-width="2" marker-end="url(#arr)"/>

    <!-- SAVE STATE -->
    <rect x="360" y="480" width="200" height="50" rx="8" fill="#E8EDF5"/>
    <text x="460" y="502" fill="#1D2433" text-anchor="middle" font-size="11" font-weight="bold">保存三元组</text>
    <text x="460" y="518" fill="#5A6478" text-anchor="middle" font-size="9">resumePage | resumeNodeID | resumeSec</text>

    <line x1="560" y1="505" x2="650" y2="505" stroke="#5A6478" stroke-width="2" marker-end="url(#arr)"/>

    <!-- RESTORE -->
    <rect x="660" y="480" width="200" height="50" rx="8" fill="#E8EDF5"/>
    <text x="760" y="502" fill="#1D2433" text-anchor="middle" font-size="11" font-weight="bold">&#x25B6; 恢复学习</text>
    <text x="760" y="518" fill="#5A6478" text-anchor="middle" font-size="9">从Redis读取</text>

    <line x1="860" y1="505" x2="950" y2="505" stroke="#5A6478" stroke-width="2" marker-end="url(#arr)"/>

    <!-- RESUME DECISION -->
    <rect x="960" y="470" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#7B5BE0" stroke-width="2"/>
    <rect x="960" y="470" width="200" height="28" rx="12" fill="#7B5BE0"/>
    <text x="1060" y="490" fill="#FFFFFF" text-anchor="middle" font-size="11" font-weight="bold">续接决策</text>
    <text x="1060" y="515" fill="#5A6478" text-anchor="middle" font-size="9">判定理解程度</text>
    <text x="1060" y="530" fill="#5A6478" text-anchor="middle" font-size="9">选择续接模式</text>
  </g>

  <!-- Bottom legend -->
  <rect x="55" y="600" width="1170" height="70" rx="8" fill="#F4F7FC"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="10">
    <circle cx="100" cy="620" r="6" fill="#1E6FE0"/>
    <text x="115" y="624" fill="#5A6478">主学习状态</text>
    <circle cx="220" cy="620" r="6" fill="#0E8C80"/>
    <text x="235" y="624" fill="#5A6478">交互状态</text>
    <circle cx="340" cy="620" r="6" fill="#E8553C"/>
    <text x="355" y="624" fill="#5A6478">决策/判定</text>
    <circle cx="460" cy="620" r="6" fill="#7B5BE0"/>
    <text x="475" y="624" fill="#5A6478">续接决策</text>
    <circle cx="600" cy="620" r="6" fill="#9AA3B5"/>
    <text x="615" y="624" fill="#5A6478">打断/恢复</text>
    <rect x="100" y="640" width="14" height="3" fill="#5A6478"/>
    <text x="120" y="644" fill="#5A6478">正向流转</text>
    <rect x="240" y="640" width="14" height="3" fill="#5A6478" stroke-dasharray="4,2"/>
    <text x="260" y="644" fill="#5A6478">打断/恢复</text>
  </g>

  <rect x="55" y="690" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">09d</text>
</svg>
