    <text x="629" y="243" fill="#5A6478" text-anchor="middle" font-size="9">节点构建</text>
    <text x="629" y="258" fill="#5A6478" text-anchor="middle" font-size="9">脚本输出</text>
    <line x1="694" y1="230" x2="717" y2="230" stroke="#D0D7E2" stroke-width="1.5"/>

    <rect x="727" y="185" width="130" height="90" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="792" y="210" fill="#1E6FE0" text-anchor="middle" font-size="11" font-weight="bold">语音合成</text>
    <text x="792" y="228" fill="#5A6478" text-anchor="middle" font-size="9">文本处理</text>
    <text x="792" y="243" fill="#5A6478" text-anchor="middle" font-size="9">TTS转换</text>
    <text x="792" y="258" fill="#5A6478" text-anchor="middle" font-size="9">音频输出</text>

