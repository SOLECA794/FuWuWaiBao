    <polygon points="620,375 628,371 628,379" fill="#5A6478"/>
    <rect x="635" y="360" width="110" height="30" rx="4" fill="#FFFFFF" stroke="#0E8C80" stroke-width="0.5"/>
    <text x="690" y="379" fill="#0E8C80" text-anchor="middle" font-size="10">答案生成</text>

    <rect x="75" y="400" width="760" height="30" rx="4" fill="#E8EDF5"/>
    <text x="455" y="420" fill="#5A6478" text-anchor="middle" font-size="10">三级级联检索范围：L1 目标节点 &#8594; L2 当前页 &#8594; L3 全页拼接</text>

    <!-- Layer 3: Multi-model -->
    <rect x="880" y="315" width="345" height="130" rx="8" fill="#F4F7FC" stroke="#7B5BE0" stroke-width="1"/>
    <rect x="880" y="315" width="345" height="32" rx="8" fill="#7B5BE0"/>
    <rect x="880" y="339" width="345" height="8" fill="#7B5BE0"/>
    <text x="1052" y="335" fill="#FFFFFF" text-anchor="middle" font-size="13" font-weight="bold">下层：模型适配与管理</text>

    <rect x="895" y="360" width="310" height="22" rx="4" fill="#FFFFFF" stroke="#7B5BE0" stroke-width="0.5"/>
    <text x="1050" y="375" fill="#5A6478" text-anchor="middle" font-size="9">大模型适配层（统一接口，引擎无关）</text>
    <rect x="895" y="390" width="150" height="22" rx="4" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="0.5"/>
    <text x="970" y="405" fill="#1E6FE0" text-anchor="middle" font-size="9">通义千问（当前）</text>
    <rect x="1055" y="390" width="150" height="22" rx="4" fill="#DDE6FF" stroke="#0E8C80" stroke-width="0.5"/>
    <text x="1130" y="405" fill="#0E8C80" text-anchor="middle" font-size="9">备用推理引擎</text>
    <rect x="895" y="418" width="310" height="18" rx="4" fill="#E8EDF5"/>
    <text x="1050" y="431" fill="#9AA3B5" text-anchor="middle" font-size="9">模型切换零改动 — 适配层配置化</text>

