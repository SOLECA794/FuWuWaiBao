    <rect x="55" y="460" width="1170" height="100" rx="8" fill="#F4F7FC" stroke="#E8553C" stroke-width="1"/>
    <rect x="55" y="460" width="1170" height="32" rx="8" fill="#E8553C"/>
    <rect x="55" y="484" width="1170" height="8" fill="#E8553C"/>
    <text x="640" y="480" fill="#FFFFFF" text-anchor="middle" font-size="13" font-weight="bold">降级容错机制</text>

    <rect x="80" y="500" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="180" y="525" fill="#1E6FE0" text-anchor="middle" font-size="11" font-weight="bold">Dify工作流正常</text>
    <polygon points="290,520 300,514 300,526" fill="#5A6478"/>
    <rect x="310" y="500" width="200" height="40" rx="6" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="410" y="525" fill="#1E6FE0" text-anchor="middle" font-size="11">直通处理</text>
    <path d="M520,520 L555,520 L555,550 L580,550" fill="none" stroke="#E8553C" stroke-width="1.5" stroke-dasharray="4,2"/>
    <rect x="590" y="500" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#E8553C" stroke-width="1"/>
    <text x="690" y="525" fill="#E8553C" text-anchor="middle" font-size="11" font-weight="bold">主引擎不可用</text>
    <polygon points="800,520 810,514 810,526" fill="#E8553C"/>
    <rect x="820" y="500" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#0E8C80" stroke-width="1"/>
    <text x="930" y="525" fill="#0E8C80" text-anchor="middle" font-size="11" font-weight="bold">备用推理引擎自动接管</text>
    <text x="640" y="565" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" fill="#9AA3B5" text-anchor="middle">主引擎（Dify工作流编排）&#x2194; 备用推理引擎（Python实现完整功能子集）— 切换对前端完全透明</text>
  </g>

  <rect x="55" y="690" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">09c</text>
</svg>
