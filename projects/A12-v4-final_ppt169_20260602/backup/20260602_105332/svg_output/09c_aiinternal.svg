    <rect x="55" y="164" width="1170" height="8" fill="#1E6FE0"/>
    <text x="640" y="160" fill="#FFFFFF" text-anchor="middle" font-size="13" font-weight="bold">上层：Dify工作流编排层 — 5大工作流</text>

    <rect x="75" y="185" width="130" height="90" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="140" y="210" fill="#1E6FE0" text-anchor="middle" font-size="11" font-weight="bold">课件解析</text>
    <text x="140" y="228" fill="#5A6478" text-anchor="middle" font-size="9">文件提取</text>
    <text x="140" y="243" fill="#5A6478" text-anchor="middle" font-size="9">VLM识别</text>
    <text x="140" y="258" fill="#5A6478" text-anchor="middle" font-size="9">结构化</text>
    <line x1="205" y1="230" x2="228" y2="230" stroke="#D0D7E2" stroke-width="1.5"/>

    <rect x="238" y="185" width="130" height="90" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="303" y="210" fill="#1E6FE0" text-anchor="middle" font-size="11" font-weight="bold">知识入库</text>
    <text x="303" y="228" fill="#5A6478" text-anchor="middle" font-size="9">内容切片</text>
    <text x="303" y="243" fill="#5A6478" text-anchor="middle" font-size="9">向量化</text>
    <text x="303" y="258" fill="#5A6478" text-anchor="middle" font-size="9">索引构建</text>
    <line x1="368" y1="230" x2="391" y2="230" stroke="#D0D7E2" stroke-width="1.5"/>

    <rect x="401" y="185" width="130" height="90" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="466" y="210" fill="#1E6FE0" text-anchor="middle" font-size="11" font-weight="bold">智能问答</text>
    <text x="466" y="228" fill="#5A6478" text-anchor="middle" font-size="9">意图识别</text>
    <text x="466" y="243" fill="#5A6478" text-anchor="middle" font-size="9">知识检索</text>
    <text x="466" y="258" fill="#5A6478" text-anchor="middle" font-size="9">回答生成</text>
    <line x1="531" y1="230" x2="554" y2="230" stroke="#D0D7E2" stroke-width="1.5"/>

    <rect x="564" y="185" width="130" height="90" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="629" y="210" fill="#1E6FE0" text-anchor="middle" font-size="11" font-weight="bold">脚本生成</text>
