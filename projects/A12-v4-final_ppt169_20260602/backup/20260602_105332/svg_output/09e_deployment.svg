<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#3A7BED"/></linearGradient></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="55" y="30" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold" letter-spacing="1">泛雅 AI 智课</text>
  <rect x="55" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="195" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目背景</text>
  <rect x="345" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="485" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">解决方案</text>
  <rect x="635" y="45" width="280" height="32" rx="4" fill="#1E6FE0"/><text x="775" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">系统实现</text>
  <rect x="925" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="1065" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目总结</text>
  <text x="55" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" fill="#1D2433" font-weight="bold">系统部署架构图</text>
  <rect x="55" y="118" width="50" height="3" rx="1.5" fill="#0E8C80"/>
  <text x="55" y="140" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478">Docker容器化部署 · 三层安全区域</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <!-- DMZ zone -->
    <rect x="55" y="160" width="1170" height="140" rx="8" fill="#FFF0E8" stroke="#E8553C" stroke-width="1.5" stroke-dasharray="8,3"/>
    <text x="70" y="178" fill="#E8553C" font-size="11" font-weight="bold">DMZ区</text>
    <rect x="80" y="195" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#E8553C" stroke-width="1.5"/>
    <text x="190" y="222" fill="#E8553C" text-anchor="middle" font-size="13" font-weight="bold">Nginx反向代理</text>
    <text x="190" y="240" fill="#5A6478" text-anchor="middle" font-size="10">SSL termination</text>
    <text x="190" y="256" fill="#5A6478" text-anchor="middle" font-size="10">Round-Robin负载均衡</text>
    <rect x="380" y="195" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#E8553C" stroke-width="1.5"/>
    <text x="490" y="222" fill="#E8553C" text-anchor="middle" font-size="13" font-weight="bold">泛雅OpenAPI网关</text>
    <text x="490" y="240" fill="#5A6478" text-anchor="middle" font-size="10">鉴权校验</text>
    <text x="490" y="256" fill="#5A6478" text-anchor="middle" font-size="10">签名验证</text>

    <!-- App zone -->
    <rect x="55" y="315" width="1170" height="200" rx="8" fill="#E8EDF5" stroke="#1E6FE0" stroke-width="1.5" stroke-dasharray="8,3"/>
    <text x="70" y="333" fill="#1E6FE0" font-size="11" font-weight="bold">应用区</text>
    <rect x="80" y="345" width="160" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
    <text x="160" y="372" fill="#1E6FE0" text-anchor="middle" font-size="12" font-weight="bold">Go后端</text>
    <text x="160" y="390" fill="#5A6478" text-anchor="middle" font-size="9">编排层实例</text>
    <text x="160" y="405" fill="#5A6478" text-anchor="middle" font-size="9">无状态·可扩展</text>
    <rect x="260" y="345" width="160" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
    <text x="340" y="372" fill="#1E6FE0" text-anchor="middle" font-size="12" font-weight="bold">Python引擎</text>
    <text x="340" y="390" fill="#5A6478" text-anchor="middle" font-size="9">AI能力层</text>
    <text x="340" y="405" fill="#5A6478" text-anchor="middle" font-size="9">备用推理</text>
    <rect x="520" y="345" width="160" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
    <text x="600" y="372" fill="#1E6FE0" text-anchor="middle" font-size="12" font-weight="bold">Vue前端</text>
    <text x="600" y="390" fill="#5A6478" text-anchor="middle" font-size="9">静态资源</text>
    <text x="600" y="405" fill="#5A6478" text-anchor="middle" font-size="9">Nginx托管</text>
    <rect x="780" y="345" width="200" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
    <text x="880" y="372" fill="#1E6FE0" text-anchor="middle" font-size="12" font-weight="bold">Dify工作流引擎</text>
    <text x="880" y="390" fill="#5A6478" text-anchor="middle" font-size="9">AI主引擎</text>
    <text x="880" y="405" fill="#5A6478" text-anchor="middle" font-size="9">工作流可视化编排</text>
    <text x="640" y="460" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#1E6FE0" text-anchor="middle">应用容器集群：Docker Compose编排 · 统一日志采集 · 健康检查</text>
    <text x="640" y="478" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#1E6FE0" text-anchor="middle">水平扩展：Go编排层无状态可多实例 · Dify/Python/前端均可独立扩缩容</text>

    <!-- Data zone -->
    <rect x="55" y="530" width="1170" height="130" rx="8" fill="#EDE7F6" stroke="#7B5BE0" stroke-width="1.5" stroke-dasharray="8,3"/>
    <text x="70" y="548" fill="#7B5BE0" font-size="11" font-weight="bold">数据区</text>
    <rect x="80" y="560" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#7B5BE0" stroke-width="1.5"/>
    <use data-icon="tabler-filled/database" x="100" y="580" width="18" height="18" fill="#7B5BE0"/>
    <text x="190" y="595" fill="#7B5BE0" text-anchor="middle" font-size="12" font-weight="bold">PostgreSQL</text>
    <text x="190" y="615" fill="#5A6478" text-anchor="middle" font-size="9">结构化数据存储</text>
    <text x="190" y="630" fill="#5A6478" text-anchor="middle" font-size="9">主从备份</text>
    <rect x="380" y="560" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#7B5BE0" stroke-width="1.5"/>
    <use data-icon="tabler-filled/database" x="400" y="580" width="18" height="18" fill="#7B5BE0"/>
    <text x="490" y="595" fill="#7B5BE0" text-anchor="middle" font-size="12" font-weight="bold">Redis</text>
    <text x="490" y="615" fill="#5A6478" text-anchor="middle" font-size="9">缓存与任务队列</text>
    <text x="490" y="630" fill="#5A6478" text-anchor="middle" font-size="9">哨兵高可用</text>
    <rect x="680" y="560" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#7B5BE0" stroke-width="1.5"/>
    <use data-icon="tabler-filled/cloud" x="700" y="580" width="18" height="18" fill="#7B5BE0"/>
    <text x="790" y="595" fill="#7B5BE0" text-anchor="middle" font-size="12" font-weight="bold">MinIO</text>
    <text x="790" y="615" fill="#5A6478" text-anchor="middle" font-size="9">对象文件存储</text>
    <text x="790" y="630" fill="#5A6478" text-anchor="middle" font-size="9">纠删码</text>
  </g>

  <rect x="55" y="690" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">09e</text>
</svg>
