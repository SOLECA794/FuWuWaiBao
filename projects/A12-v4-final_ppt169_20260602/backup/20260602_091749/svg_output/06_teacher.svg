<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#1E6FE0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1E6FE0" font-weight="bold" letter-spacing="1">教师端</text>
  <text x="60" y="100" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" fill="#1D2433" font-weight="bold">教师端：把备课从&#8220;逐字撰写&#8221;变成&#8220;编辑确认&#8221;</text>
  <rect x="60" y="115" width="60" height="3" rx="1.5" fill="#0E8C80"/>

  <!-- 5-step horizontal flow -->
  <g>
    <!-- Step 1 -->
    <rect x="60" y="150" width="200" height="90" rx="10" fill="#1E6FE0"/>
    <text x="100" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">01</text>
    <text x="100" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FFFFFF">智课生成</text>
    <text x="100" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.7">三阶段解耦管线</text>
    <polygon points="270,195 282,188 282,202" fill="#9AA3B5"/>

    <!-- Step 2 -->
    <rect x="290" y="150" width="200" height="90" rx="10" fill="#1E6FE0"/>
    <text x="330" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">02</text>
    <text x="330" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FFFFFF">脚本编辑</text>
    <text x="330" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.7">节点粒度编辑确认</text>
    <polygon points="500,195 512,188 512,202" fill="#9AA3B5"/>

    <!-- Step 3 -->
    <rect x="520" y="150" width="200" height="90" rx="10" fill="#1E6FE0"/>
    <text x="560" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">03</text>
    <text x="560" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FFFFFF">发布授课</text>
    <text x="560" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.7">TTS语音合成+播放</text>
    <polygon points="730,195 742,188 742,202" fill="#9AA3B5"/>

    <!-- Step 4 -->
    <rect x="750" y="150" width="200" height="90" rx="10" fill="#0E8C80"/>
    <text x="790" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">04</text>
    <text x="790" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FFFFFF">学情查看</text>
    <text x="790" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.7">四维加权难度指数</text>
    <polygon points="960,195 972,188 972,202" fill="#9AA3B5"/>

    <!-- Step 5 -->
    <rect x="980" y="150" width="200" height="90" rx="10" fill="#1E6FE0"/>
    <text x="1020" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">05</text>
    <text x="1020" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FFFFFF">讲稿优化</text>
    <text x="1020" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity="0.7">学情驱动迭代</text>
  </g>

  <!-- Tech detail cards -->
  <text x="60" y="290" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#1D2433" font-weight="bold">关键技术细节</text>

  <!-- Card 1: Three-stage pipeline -->
  <rect x="60" y="310" width="560" height="170" rx="10" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <rect x="60" y="310" width="560" height="5" rx="2.5" fill="#1E6FE0"/>
  <text x="80" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#1D2433" font-weight="bold">三阶段解耦生成管线</text>
  <rect x="80" y="365" width="160" height="30" rx="6" fill="#DDE6FF"/>
  <text x="160" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1E6FE0" text-anchor="middle">Stage1 Markdown理解</text>
  <rect x="250" y="365" width="160" height="30" rx="6" fill="#DDE6FF"/>
  <text x="330" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1E6FE0" text-anchor="middle">Stage2 节点树构建</text>
  <rect x="420" y="365" width="180" height="30" rx="6" fill="#DDE6FF"/>
  <text x="510" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1E6FE0" text-anchor="middle">Stage3 逐节点脚本生成</text>
  <text x="80" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5A6478">每阶段独立可优化，单节点失败不影响整体。JSON Schema强制结构化输出。</text>
  <text x="80" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5A6478">教师可在节点粒度上编辑调整脚本内容。</text>

  <!-- Card 2: Mastery index -->
  <rect x="650" y="310" width="570" height="170" rx="10" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5"/>
  <rect x="650" y="310" width="570" height="5" rx="2.5" fill="#0E8C80"/>
  <text x="670" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#1D2433" font-weight="bold">多维加权难度指数</text>
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5A6478">
    <rect x="670" y="365" width="120" height="30" rx="6" fill="#D6DEF5"/>
    <text x="730" y="384" fill="#0E8C80" text-anchor="middle" font-weight="bold">提问频次</text>
    <rect x="800" y="365" width="120" height="30" rx="6" fill="#D6DEF5"/>
    <text x="860" y="384" fill="#0E8C80" text-anchor="middle" font-weight="bold">需重讲次数</text>
    <rect x="930" y="365" width="120" height="30" rx="6" fill="#D6DEF5"/>
    <text x="990" y="384" fill="#0E8C80" text-anchor="middle" font-weight="bold">会话数</text>
    <rect x="1060" y="365" width="130" height="30" rx="6" fill="#D6DEF5"/>
    <text x="1125" y="384" fill="#0E8C80" text-anchor="middle" font-weight="bold">停留时长比</text>
  </g>
  <text x="670" y="425" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5A6478">综合四维加权 → 难度指数（0-10），精确定位班级共性卡点</text>
  <text x="670" y="445" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5A6478">掌握度模型：答对+0.08 / 答错-0.06 / 快速响应+0.02，区间[0,1]</text>

  <!-- Bottom: student interaction stats preview -->
  <rect x="60" y="500" width="1160" height="140" rx="10" fill="#F4F7FC"/>
  <text x="80" y="530" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1D2433" font-weight="bold">学情看板</text>
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5A6478">
    <circle cx="140" cy="565" r="6" fill="#0E8C80"/>
    <text x="155" y="570">掌握度 &gt; 0.7的知识点占比：72%</text>
    <circle cx="500" cy="565" r="6" fill="#0E8C80"/>
    <text x="515" y="570">需重讲的知识点数：3个</text>
    <rect x="80" y="590" width="260" height="6" rx="3" fill="#D0D7E2"/>
    <rect x="80" y="590" width="180" height="6" rx="3" fill="#0E8C80"/>
    <text x="360" y="596" fill="#9AA3B5">班级平均掌握度 0.72</text>
  </g>

  <rect x="60" y="680" width="1160" height="1" fill="#D0D7E2"/>
  <text x="60" y="700" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1220" y="700" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#9AA3B5" text-anchor="end">06</text>
</svg>
