<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1E6FE0"/><stop offset="100%" stop-color="#3A7BED"/></linearGradient></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect width="1280" height="4" fill="url(#topBar)"/>
  <text x="55" y="30" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold" letter-spacing="1">泛雅 AI 智课</text>
  <rect x="55" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="195" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目背景</text>
  <rect x="345" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="485" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">解决方案</text>
  <rect x="635" y="45" width="280" height="32" rx="4" fill="#1E6FE0"/><text x="775" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">系统实现</text>
  <rect x="925" y="45" width="280" height="32" rx="4" fill="#E8EDF5"/><text x="1065" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目总结</text>

  <text x="55" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" fill="#1D2433" font-weight="bold">三大模块 · 交付验收</text>
  <rect x="55" y="118" width="50" height="3" rx="1.5" fill="#0E8C80"/>
  <text x="55" y="140" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478">交付能力 + 实现支撑 + 验证方式 = 可验收</text>

  <!-- ===== Module 1 ===== -->
  <rect x="55" y="155" width="380" height="32" rx="6" fill="#1E6FE0"/>
  <text x="245" y="177" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">模块一：智课生成</text>
  <rect x="55" y="190" width="380" height="195" rx="0" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">
    <rect x="55" y="190" width="6" height="195" fill="#1E6FE0"/>
    <text x="75" y="213" fill="#1D2433" font-weight="bold">交付能力</text>
    <text x="75" y="233" fill="#5A6478">课件上传后自动完成三阶段解耦解析，</text>
    <text x="75" y="250" fill="#5A6478">输出可编辑的结构化讲稿</text>
    <text x="75" y="275" fill="#1D2433" font-weight="bold">实现支撑与验证</text>
    <text x="75" y="295" fill="#5A6478">&#x25B8; 三阶段管线逐层校验，LLM输出异常自动修</text>
    <text x="85" y="312" fill="#5A6478">复格式；单阶段LLM调用失败&#8594;降级模板兜底</text>
    <text x="75" y="332" fill="#5A6478">&#x25B8; 管线可完成率&#8805;98%（设计保证：每阶段</text>
    <text x="85" y="349" fill="#5A6478">有校验和降级双保险，管线不会无输出）</text>
    <text x="75" y="369" fill="#5A6478">&#x25B8; 测试方式：单元测试覆盖三阶段各Schema</text>
    <text x="85" y="386" fill="#5A6478">校验路径+降级触发场景验证</text>
  </g>

  <!-- ===== Module 2 ===== -->
  <rect x="450" y="155" width="380" height="32" rx="6" fill="#0E8C80"/>
  <text x="640" y="177" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">模块二：实时问答</text>
  <rect x="450" y="190" width="380" height="195" rx="0" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">
    <rect x="450" y="190" width="6" height="195" fill="#0E8C80"/>
    <text x="470" y="213" fill="#1D2433" font-weight="bold">交付能力</text>
    <text x="470" y="233" fill="#5A6478">学生提问后SSE流式推送引导式回答，</text>
    <text x="470" y="250" fill="#5A6478">回答绑定溯源页码</text>
    <text x="470" y="275" fill="#1D2433" font-weight="bold">实现支撑与验证</text>
    <text x="470" y="295" fill="#5A6478">&#x25B8; SSE三事件协议实现流式输出，首词独立于事</text>
    <text x="480" y="312" fill="#5A6478">件通道，不受全量生成延迟影响（架构保证）</text>
    <text x="470" y="332" fill="#5A6478">&#x25B8; 编排层仅做流式转发不参与AI推理，转发延迟</text>
    <text x="480" y="349" fill="#5A6478">&#60;5ms；端到端首包延迟 &#60;500ms（设计指标）</text>
    <text x="470" y="369" fill="#5A6478">&#x25B8; 测试方式：SSE流式事件完整性验证+并发问</text>
    <text x="480" y="386" fill="#5A6478">答场景覆盖+回答溯源校验</text>
  </g>

  <!-- ===== Module 3 ===== -->
  <rect x="845" y="155" width="380" height="32" rx="6" fill="#7B5BE0"/>
  <text x="1035" y="177" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">模块三：进度续接</text>
  <rect x="845" y="190" width="380" height="195" rx="0" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">
    <rect x="845" y="190" width="6" height="195" fill="#7B5BE0"/>
    <text x="865" y="213" fill="#1D2433" font-weight="bold">交付能力</text>
    <text x="865" y="233" fill="#5A6478">打断后基于理解程度判定自动选择续讲/</text>
    <text x="865" y="250" fill="#5A6478">补充/重讲，节点级精确恢复</text>
    <text x="865" y="275" fill="#1D2433" font-weight="bold">实现支撑与验证</text>
    <text x="865" y="295" fill="#5A6478">&#x25B8; 节点级定位：教学节点为最小语义单元，续接</text>
    <text x="875" y="312" fill="#5A6478">游标记录页面+节点+秒数三元组（结构保证）</text>
    <text x="865" y="332" fill="#5A6478">&#x25B8; 理解判定双路机制：LLM语义分析优先，接口</text>
    <text x="875" y="349" fill="#5A6478">不可用时降级至关键词匹配（设计保证）</text>
    <text x="865" y="369" fill="#5A6478">&#x25B8; 测试方式：全态（none/partial/full）判定路</text>
    <text x="875" y="386" fill="#5A6478">由验证+持久化恢复正确性覆盖</text>
  </g>

  <!-- Bottom: verification methodology -->
  <rect x="55" y="400" width="1170" height="100" rx="8" fill="#F4F7FC" stroke="#D0D7E2" stroke-width="1"/>
  <text x="640" y="423" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" text-anchor="middle" font-weight="bold">验证方法论</text>
  <text x="640" y="443" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478" text-anchor="middle">区分"设计保证"（架构层面决定的指标）与"实测验证"（通过具体测试手段覆盖的指标）</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6478">
    <!-- Design guarantee -->
    <rect x="75" y="458" width="545" height="28" rx="6" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1"/>
    <circle cx="95" cy="472" r="5" fill="#1E6FE0"/>
    <text x="110" y="476" fill="#1E6FE0" font-weight="bold">设计保证：</text>
    <text x="185" y="476">SSE首词独立推送不受全量延迟影响（架构决定）</text>
    <text x="75" y="476" fill="#1E6FE0">&#x25CF;</text>

    <!-- Test verified -->
    <rect x="640" y="458" width="565" height="28" rx="6" fill="#FFFFFF" stroke="#0E8C80" stroke-width="1"/>
    <circle cx="660" cy="472" r="5" fill="#0E8C80"/>
    <text x="675" y="476" fill="#0E8C80" font-weight="bold">实测验证：</text>
    <text x="750" y="476">单元测试覆盖Schema校验路径、降级触发场景、SSE事件完整性</text>

    <rect x="75" y="492" width="545" height="0" rx="0" fill="none"/>
    <text x="75" y="478" fill="#1E6FE0">&#x25CF;</text>
    <text x="110" y="482" fill="#5A6478">节点级恢复粒度由TeachingNode数据结构保证（结构决定）</text>

    <rect x="640" y="492" width="565" height="0" rx="0" fill="none"/>
    <text x="660" y="488" fill="#0E8C80">&#x25CF;</text>
    <text x="675" y="492" fill="#5A6478">集成测试覆盖Dify工作流调用、降级切换和SSE数据流</text>
  </g>

  <!-- Delivery conclusion -->
  <rect x="55" y="515" width="1170" height="38" rx="8" fill="#1E6FE0" fill-opacity="0.06"/>
  <text x="640" y="532" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#1D2433" text-anchor="middle" font-weight="bold">交付验收</text>
  <text x="640" y="546" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478" text-anchor="middle">三大模块核心功能均具备明确的实现支撑与验证覆盖，可支撑泛雅平台外包交付验收</text>

  <!-- Speaker notes -->
  <rect x="55" y="565" width="1170" height="95" rx="8" fill="#E8EDF5"/>
  <text x="75" y="588" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#1D2433" font-weight="bold">答辩讲解要点</text>
  <text x="75" y="610" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478">
    <tspan x="75" dy="0">"三个模块的交付验证我们区分了"设计保证"和"实测验证"两个维度。</tspan>
    <tspan x="75" dy="18">比如SSE首包延迟小于500毫秒——这不是跑一次压测得到的数据，而是架构层面决定的：编排层只做</tspan>
    <tspan x="75" dy="18">转发不做推理，首词通过独立事件通道推送，不受全量生成延迟影响。管线可完成率98%以上——</tspan>
    <tspan x="75" dy="18">是因为每阶段有校验和降级双保险，不是测了100次过了98次。"</tspan>
  </text>

  <rect x="55" y="692" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="710" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="710" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">14</text>
</svg>
