  <text x="945" y="308" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#0E8C80" text-anchor="middle">部分理解</text>
  <text x="945" y="322" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#0E8C80" fill-opacity="0.7" text-anchor="middle">→ 补充讲解</text>

  <path fill="#DDE6FF" d="M1058,265 H1192 A8,8 0 0 1 1200,273 V322 A8,8 0 0 1 1192,330 H1058 A8,8 0 0 1 1050,322 V273 A8,8 0 0 1 1058,265 Z" />
  <text x="1125" y="290" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#0E8C80" text-anchor="middle" font-weight="bold">● full</text>
  <text x="1125" y="308" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#0E8C80" text-anchor="middle">已理解</text>
  <text x="1125" y="322" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="9" fill="#0E8C80" fill-opacity="0.7" text-anchor="middle">→ 跳过继续</text>

  <text x="670" y="365" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5A6478">打断时保存三元组：resumePage | resumeNodeID | resumeSec（精确到音频秒数）</text>

  
