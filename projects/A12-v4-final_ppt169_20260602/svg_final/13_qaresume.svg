  </g>

  <text x="80" y="310" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1D2433" font-weight="bold">苏格拉底式教学约束</text>
  <text fill="#5A6478" font-size="11" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="80" y="335">✖ 严禁直接给最终答案</text><text fill="#5A6478" font-size="11" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="80" y="357">✔ 先确认学生卡点 → 逐步引导思路 → 以问题结尾</text><text fill="#5A6478" font-size="11" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" x="80" y="379">✔ 回答绑定课件溯源页码，降低幻觉</text><rect x="80" y="385" width="520" height="1" fill="#D0D7E2" />
  <text x="80" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#1E6FE0">SSE三事件推送：token 逐词 → sentence 完整回答 → final 结构化元数据</text>

  
