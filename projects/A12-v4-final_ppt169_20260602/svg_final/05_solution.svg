  <rect x="55" y="214" width="280" height="12" fill="#1E6FE0" />
  
  <g transform="translate(85.0, 188.0) scale(0.9166666666666666)" fill="#FFFFFF">
    <path d="M12 2a5 5 0 1 1 -5 5l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
