  <path fill="#1E6FE0" d="M349,45 H621 A4,4 0 0 1 625,49 V73 A4,4 0 0 1 621,77 H349 A4,4 0 0 1 345,73 V49 A4,4 0 0 1 349,45 Z" /><text x="485" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">解决方案</text>
  <path fill="#E8EDF5" d="M639,45 H911 A4,4 0 0 1 915,49 V73 A4,4 0 0 1 911,77 H639 A4,4 0 0 1 635,73 V49 A4,4 0 0 1 639,45 Z" /><text x="775" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">系统实现</text>
  <path fill="#E8EDF5" d="M929,45 H1201 A4,4 0 0 1 1205,49 V73 A4,4 0 0 1 1201,77 H929 A4,4 0 0 1 925,73 V49 A4,4 0 0 1 929,45 Z" /><text x="1065" y="66" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">项目总结</text>

  <text x="55" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" fill="#1D2433" font-weight="bold">一套底座，两端分工</text>
  <path fill="#0E8C80" d="M56.50,118 H103.50 A1.50,1.50 0 0 1 105,119.50 V119.50 A1.50,1.50 0 0 1 103.50,121 H56.50 A1.50,1.50 0 0 1 55,119.50 V119.50 A1.50,1.50 0 0 1 56.50,118 Z" />
  <text x="55" y="140" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478">共享的AI能力平台 + 教师端与学生端两个独立应用入口</text>

  
  
  <path fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5" d="M67,170 H323 A12,12 0 0 1 335,182 V518 A12,12 0 0 1 323,530 H67 A12,12 0 0 1 55,518 V182 A12,12 0 0 1 67,170 Z" />
