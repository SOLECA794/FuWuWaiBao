    <path d="M12 2a5 5 0 1 1 -5 5l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
    <path d="M14 14a5 5 0 0 1 5 5v1a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-1a5 5 0 0 1 5 -5h4z" />
  </g>
  <text x="1010" y="206" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">学生端</text>

  <text x="965" y="255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" font-weight="bold">专注：学习与互动</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478">
    <path fill="#FFFFFF" d="M971,275 H1199 A6,6 0 0 1 1205,281 V301 A6,6 0 0 1 1199,307 H971 A6,6 0 0 1 965,301 V281 A6,6 0 0 1 971,275 Z" />
    <text x="980" y="295">课件播放与学习进度跟踪</text>
    <path fill="#FFFFFF" d="M971,315 H1199 A6,6 0 0 1 1205,321 V341 A6,6 0 0 1 1199,347 H971 A6,6 0 0 1 965,341 V321 A6,6 0 0 1 971,315 Z" />
    <text x="980" y="335">上下文问答（苏格拉底式）</text>
    <path fill="#FFFFFF" d="M971,355 H1199 A6,6 0 0 1 1205,361 V381 A6,6 0 0 1 1199,387 H971 A6,6 0 0 1 965,381 V361 A6,6 0 0 1 971,355 Z" />
    <text x="980" y="375">断点续学（三态续接）</text>
    <path fill="#FFFFFF" d="M971,395 H1199 A6,6 0 0 1 1205,401 V421 A6,6 0 0 1 1199,427 H971 A6,6 0 0 1 965,421 V401 A6,6 0 0 1 971,395 Z" />
    <text x="980" y="415">薄弱点检测与针对性练习</text>
  </g>
  <text x="965" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#0E8C80">不关心课件的制作过程</text>
  <text x="965" y="472" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#0E8C80">只需专注学习本身</text>

  
  <path fill="#F4F7FC" d="M65,560 H1215 A10,10 0 0 1 1225,570 V650 A10,10 0 0 1 1215,660 H65 A10,10 0 0 1 55,650 V570 A10,10 0 0 1 65,560 Z" />
  <text x="640" y="585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" text-anchor="middle" font-weight="bold">为什么这样设计？</text>

  <path fill="#FFFFFF" stroke="#1E6FE0" stroke-width="1" d="M88,600 H612 A8,8 0 0 1 620,608 V634 A8,8 0 0 1 612,642 H88 A8,8 0 0 1 80,634 V608 A8,8 0 0 1 88,600 Z" />
  <text x="100" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" font-weight="bold">① 一次解析，两端消费</text>
  <text x="100" y="636" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478">课件只需在底座中完成一次结构化解析，教师端用于编辑确认，学生端用于学习消费——同一份内容，两种使用场景</text>

  <path fill="#FFFFFF" stroke="#0E8C80" stroke-width="1" d="M658,600 H1202 A8,8 0 0 1 1210,608 V634 A8,8 0 0 1 1202,642 H658 A8,8 0 0 1 650,634 V608 A8,8 0 0 1 658,600 Z" />
  <text x="670" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#0E8C80" font-weight="bold">② 职责分离，互不干扰</text>
  <text x="670" y="636" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6478">教师端只为内容生产和学情分析负责；学生端只为学习体验和互动效果负责。两端共享底座能力，但不互相依赖对方的业务逻辑</text>

  <rect x="55" y="692" width="1170" height="1" fill="#D0D7E2" />
  <text x="55" y="710" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="710" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">05</text>
