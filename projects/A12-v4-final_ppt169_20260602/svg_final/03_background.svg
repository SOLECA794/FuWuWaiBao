    <text x="640" y="408">缺口一：编排能力</text>
    <text x="900" y="408" fill="#0E8C80">多阶段流程N/A编排</text>
    <path fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1" d="M626,430 H1144 A6,6 0 0 1 1150,436 V460 A6,6 0 0 1 1144,466 H626 A6,6 0 0 1 620,460 V436 A6,6 0 0 1 626,430 Z" />
    <text x="640" y="453">缺口二：容错能力</text>
    <text x="900" y="453" fill="#0E8C80">单引擎故障无法降级</text>
    <path fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1" d="M626,475 H1144 A6,6 0 0 1 1150,481 V505 A6,6 0 0 1 1144,511 H626 A6,6 0 0 1 620,505 V481 A6,6 0 0 1 626,475 Z" />
    <text x="640" y="498">缺口三：续接能力</text>
    <text x="900" y="498" fill="#0E8C80">打断后无法精确恢复</text>
  </g>

  <rect x="60" y="680" width="1160" height="1" fill="#D0D7E2" />
