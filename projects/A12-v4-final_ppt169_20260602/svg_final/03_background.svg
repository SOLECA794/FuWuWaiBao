  <text font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5A6478" x="620" y="240">单点调用大模型无法支撑完整教学闭环——</text><text font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5A6478" x="620" y="268">需要可编排、可降级、可续接的</text><text font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5A6478" x="620" y="296">系统能力</text><rect x="620" y="330" width="560" height="1" fill="#D0D7E2" />
  <text x="620" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#1D2433" font-weight="bold">三大技术缺口</text>
