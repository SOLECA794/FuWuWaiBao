  <text x="280" y="255" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#1D2433" font-weight="bold">泛雅平台现状</text>
  <text font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5A6478" x="100" y="300">泛雅平台沉淀了海量课件资源</text><text font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5A6478" x="100" y="328">但当前仅支持静态浏览和下载</text><text font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5A6478" x="100" y="356">“可看不可讲”——缺少AI交互能力</text><rect x="100" y="400" width="400" height="1" fill="#D0D7E2" />
  <text x="100" y="425" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#9AA3B5">三大技术基础已具备</text>
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#1D2433">
    <text x="120" y="455">✓ 大模型推理能力</text>
    <text x="120" y="480">✓ 多模态理解能力</text>
    <text x="120" y="505">✓ 语音合成能力</text>
  </g>

  
  <path fill="#E8EDF5" stroke="#0E8C80" stroke-width="1.5" d="M592,150 H1208 A12,12 0 0 1 1220,162 V608 A12,12 0 0 1 1208,620 H592 A12,12 0 0 1 580,608 V162 A12,12 0 0 1 592,150 Z" />
