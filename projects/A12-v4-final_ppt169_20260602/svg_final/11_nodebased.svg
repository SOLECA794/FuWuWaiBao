<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1E6FE0" /><stop offset="100%" stop-color="#1E6FE0" /></linearGradient></defs>
  <rect width="1280" height="720" fill="#FFFFFF" /><rect width="1280" height="4" fill="url(#topBar)" />
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#1E6FE0" font-weight="bold" letter-spacing="1">算法底座</text>
  <text x="60" y="100" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" fill="#1D2433" font-weight="bold">先节点化，再问答，最后续接——节点是整个系统的先节点化，再问答，最后续接#8220;通用语言先节点化，再问答，最后续接#8221;</text>
  <path fill="#0E8C80" d="M61.50,115 H118.50 A1.50,1.50 0 0 1 120,116.50 V116.50 A1.50,1.50 0 0 1 118.50,118 H61.50 A1.50,1.50 0 0 1 60,116.50 V116.50 A1.50,1.50 0 0 1 61.50,115 Z" />

  
  <text x="60" y="155" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#1D2433" font-weight="bold">三阶段解耦解析管线</text>
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <path fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5" d="M70,175 H400 A10,10 0 0 1 410,185 V295 A10,10 0 0 1 400,305 H70 A10,10 0 0 1 60,295 V185 A10,10 0 0 1 70,175 Z" />
    <text x="235" y="200" fill="#1E6FE0" text-anchor="middle" font-size="15" font-weight="bold">Stage 1：拆页渲染</text>
    <text x="235" y="220" fill="#1E6FE0" text-anchor="middle" font-size="11">输入：原始课件文本</text>
    <text x="235" y="238" fill="#1E6FE0" text-anchor="middle" font-size="11">输出：规范化Markdown + 关键知识点</text>
    <text x="235" y="256" fill="#1E6FE0" text-anchor="middle" font-size="11">约束：结构化约束模式</text>
    <text x="235" y="274" fill="#1E6FE0" text-anchor="middle" font-size="11">降级：LLM异常→预置模板</text>

    <polygon points="420,240 432,233 432,247" fill="#9AA3B5" />

    <path fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5" d="M450,175 H780 A10,10 0 0 1 790,185 V295 A10,10 0 0 1 780,305 H450 A10,10 0 0 1 440,295 V185 A10,10 0 0 1 450,175 Z" />
    <text x="615" y="200" fill="#1E6FE0" text-anchor="middle" font-size="15" font-weight="bold">Stage 2：语义聚合</text>
    <text x="615" y="220" fill="#1E6FE0" text-anchor="middle" font-size="11">输入：Stage1输出</text>
    <text x="615" y="238" fill="#1E6FE0" text-anchor="middle" font-size="11">输出：层级化节点树 nodes[]</text>
    <text x="615" y="256" fill="#1E6FE0" text-anchor="middle" font-size="11">约束：节点标识唯一性校验</text>
    <text x="615" y="274" fill="#1E6FE0" text-anchor="middle" font-size="11">降级：节点树为空→fallback</text>

    <polygon points="800,240 812,233 812,247" fill="#9AA3B5" />

    <path fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5" d="M830,175 H1210 A10,10 0 0 1 1220,185 V295 A10,10 0 0 1 1210,305 H830 A10,10 0 0 1 820,295 V185 A10,10 0 0 1 830,175 Z" />
    <text x="1020" y="200" fill="#1E6FE0" text-anchor="middle" font-size="15" font-weight="bold">Stage 3：保脉络</text>
    <text x="1020" y="220" fill="#1E6FE0" text-anchor="middle" font-size="11">输入：节点树</text>
    <text x="1020" y="238" fill="#1E6FE0" text-anchor="middle" font-size="11">输出：结构化脚本数组</text>
    <text x="1020" y="256" fill="#1E6FE0" text-anchor="middle" font-size="11">约束：6种segment类型</text>
    <text x="1020" y="274" fill="#1E6FE0" text-anchor="middle" font-size="11">降级：scripts为空→fallback</text>
  </g>
  <text x="640" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1E6FE0" text-anchor="middle">阶段独立可优化：Stage1遗忘前文不影响Stage2识别，Stage2输出有误不连累Stage3</text>

  
