  <path fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5" d="M67,150 H413 A12,12 0 0 1 425,162 V378 A12,12 0 0 1 413,390 H67 A12,12 0 0 1 55,378 V162 A12,12 0 0 1 67,150 Z" />
