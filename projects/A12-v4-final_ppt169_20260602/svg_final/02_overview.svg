  <text x="1042" y="230" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#1D2433" text-anchor="middle" font-weight="bold">能不能打断后自动续接？</text>
  <text x="1042" y="260" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">学习过程中断后，系统自动</text>
  <text x="1042" y="280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#5A6478" text-anchor="middle">判断理解程度并精确恢复</text>
  <text x="1042" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#7B5BE0" text-anchor="middle">→ 打断后自动续接</text>

  
