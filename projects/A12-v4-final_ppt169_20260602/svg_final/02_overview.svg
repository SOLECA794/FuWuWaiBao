  <text x="640" y="495" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6478" text-anchor="middle">现有的静态课件模式和通用AI方案，还无法很好地实现这三个目标</text>

  <path fill="#1E6FE0" fill-opacity="0.08" d="M65,570 H1215 A10,10 0 0 1 1225,580 V630 A10,10 0 0 1 1215,640 H65 A10,10 0 0 1 55,630 V580 A10,10 0 0 1 65,570 Z" />
