  <text x="240" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#1E6FE0" text-anchor="middle">→ 传即生成讲稿</text>

  <path fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1.5" d="M472,150 H818 A12,12 0 0 1 830,162 V378 A12,12 0 0 1 818,390 H472 A12,12 0 0 1 460,378 V162 A12,12 0 0 1 472,150 Z" />
