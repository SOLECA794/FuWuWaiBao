    <line x1="415" y1="380" x2="450" y2="380" stroke="#7B5BE0" stroke-width="1.5"/>
    <rect x="460" y="350" width="130" height="60" rx="6" fill="#DDE6FF" stroke="#0E8C80" stroke-width="1"/>
    <text x="525" y="370" fill="#0E8C80" text-anchor="middle" font-weight="bold" font-size="10">问答问答&amp;苏格拉底amp;苏格拉底</text>
    <text x="525" y="387" fill="#5A6478" text-anchor="middle" font-size="9">课程知识优先</text>
    <text x="525" y="402" fill="#5A6478" text-anchor="middle" font-size="9">禁止直接给答案</text>
    <rect x="610" y="350" width="130" height="60" rx="6" fill="#DDE6FF" stroke="#0E8C80" stroke-width="1"/>
    <text x="675" y="370" fill="#0E8C80" text-anchor="middle" font-weight="bold" font-size="10">理解度判定</text>
    <text x="675" y="387" fill="#5A6478" text-anchor="middle" font-size="9">LLM/关键词降级</text>
    <text x="675" y="402" fill="#5A6478" text-anchor="middle" font-size="9">none/partial/full</text>
    <line x1="590" y1="380" x2="608" y2="380" stroke="#0E8C80" stroke-width="1.5"/>
    <rect x="920" y="355" width="130" height="50" rx="6" fill="#DDE6FF" stroke="#7B5BE0" stroke-width="1"/>
    <text x="985" y="375" fill="#7B5BE0" text-anchor="middle" font-weight="bold" font-size="10">接收回答</text>
    <text x="985" y="390" fill="#5A6478" text-anchor="middle" font-size="9">SSE流式展示</text>
    <line x1="890" y1="380" x2="918" y2="380" stroke="#7B5BE0" stroke-width="1.5"/>
    <rect x="760" y="350" width="120" height="60" rx="6" fill="#DDE6FF" stroke="#7B5BE0" stroke-width="1"/>
    <text x="820" y="370" fill="#7B5BE0" text-anchor="middle" font-weight="bold" font-size="10">续接决策</text>
    <text x="820" y="387" fill="#5A6478" text-anchor="middle" font-size="9">三态判定</text>
    <text x="820" y="402" fill="#5A6478" text-anchor="middle" font-size="9">续讲/补充/重讲</text>

    <!-- Scene 3: Resume -->
    <rect x="920" y="485" width="130" height="50" rx="6" fill="#DDE6FF" stroke="#7B5BE0" stroke-width="1"/>
    <text x="985" y="505" fill="#7B5BE0" text-anchor="middle" font-weight="bold" font-size="10">恢复学习</text>
    <text x="985" y="520" fill="#5A6478" text-anchor="middle" font-size="9">节点级续接</text>
    <line x1="890" y1="510" x2="918" y2="510" stroke="#7B5BE0" stroke-width="1.5"/>
    <rect x="760" y="485" width="120" height="50" rx="6" fill="#DDE6FF" stroke="#7B5BE0" stroke-width="1"/>
    <text x="820" y="505" fill="#7B5BE0" text-anchor="middle" font-weight="bold" font-size="10">更新进度</text>
    <text x="820" y="520" fill="#5A6478" text-anchor="middle" font-size="9">保存三元组</text>
    <line x1="740" y1="510" x2="758" y2="510" stroke="#0E8C80" stroke-width="1.5"/>
    <rect x="610" y="485" width="120" height="50" rx="6" fill="#DDE6FF" stroke="#0E8C80" stroke-width="1"/>
    <text x="670" y="505" fill="#0E8C80" text-anchor="middle" font-weight="bold" font-size="10">查询上下文</text>
    <text x="670" y="520" fill="#5A6478" text-anchor="middle" font-size="9">Redis读取</text>
    <line x1="600" y1="510" x2="608" y2="510" stroke="#0E8C80" stroke-width="1.5"/>
    <rect x="470" y="485" width="120" height="50" rx="6" fill="#DDE6FF" stroke="#0E8C80" stroke-width="1"/>
    <text x="530" y="505" fill="#0E8C80" text-anchor="middle" font-weight="bold" font-size="10">加载断点</text>
    <text x="530" y="520" fill="#5A6478" text-anchor="middle" font-size="9">恢复位置</text>
    <line x1="415" y1="510" x2="468" y2="510" stroke="#7B5BE0" stroke-width="1.5"/>
    <rect x="315" y="485" width="100" height="50" rx="6" fill="#DDE6FF" stroke="#7B5BE0" stroke-width="1"/>
    <text x="365" y="505" fill="#7B5BE0" text-anchor="middle" font-weight="bold" font-size="10">请求续接</text>
    <text x="365" y="520" fill="#5A6478" text-anchor="middle" font-size="9">参数</text>
    <line x1="250" y1="510" x2="220" y2="510" stroke="#1E6FE0" stroke-width="1.5"/>
    <rect x="140" y="485" width="100" height="50" rx="6" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1"/>
    <text x="190" y="505" fill="#1E6FE0" text-anchor="middle" font-weight="bold" font-size="10">重新进入</text>
    <text x="190" y="520" fill="#5A6478" text-anchor="middle" font-size="9">学习页面</text>
  </g>

  <rect x="55" y="690" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
  <text x="1225" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5" text-anchor="end">09b</text>
</svg>
