  <line x1="695" y1="210" x2="725" y2="210" stroke="#1E6FE0" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="735" y="170" width="180" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
  <text x="825" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" text-anchor="middle" font-weight="bold">&#x2463; 数据持久化</text>
  <text x="825" y="222" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6478" text-anchor="middle">PostgreSQL结构化存储</text>
  <text x="825" y="237" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6478" text-anchor="middle">MinIO文件对象存储</text>
  <line x1="915" y1="210" x2="945" y2="210" stroke="#1E6FE0" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="955" y="170" width="180" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
  <text x="1045" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" text-anchor="middle" font-weight="bold">&#x2464; 数据消费</text>
  <text x="1045" y="222" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6478" text-anchor="middle">教师端学情查看</text>
  <text x="1045" y="237" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6478" text-anchor="middle">学生端断点恢复</text>

  <!-- Data flow detail table -->
  <text x="55" y="290" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1D2433" font-weight="bold">数据流转明细</text>
