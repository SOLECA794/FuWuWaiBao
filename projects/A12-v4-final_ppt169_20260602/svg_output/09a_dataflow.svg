  <!-- 5-step horizontal flow -->
  <rect x="55" y="170" width="180" height="80" rx="8" fill="#DDE6FF" stroke="#1E6FE0" stroke-width="1.5"/>
  <text x="145" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#1E6FE0" text-anchor="middle" font-weight="bold">&#x2460; 数据产生</text>
  <text x="145" y="222" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6478" text-anchor="middle">教师上传课件(PPT/PDF)</text>
