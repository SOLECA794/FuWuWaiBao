    <text x="380" y="359" fill="#5A6478" text-anchor="middle">课件源文件 + 元数据</text>
    <text x="650" y="359" fill="#5A6478" text-anchor="middle">MinIO</text>
    <text x="900" y="359" fill="#1E6FE0" text-anchor="middle">AI解析引擎</text>
    <rect x="55" y="375" width="1170" height="34" fill="#FFFFFF"/>
    <text x="150" y="396" fill="#1D2433" text-anchor="middle">AI解析完成</text>
    <text x="380" y="396" fill="#5A6478" text-anchor="middle">结构化页面 + 教学节点</text>
    <text x="650" y="396" fill="#5A6478" text-anchor="middle">PostgreSQL</text>
    <text x="900" y="396" fill="#1E6FE0" text-anchor="middle">教师端/学生端</text>
    <rect x="55" y="412" width="1170" height="34" fill="#F4F7FC"/>
    <text x="150" y="433" fill="#1D2433" text-anchor="middle">学生提问</text>
    <text x="380" y="433" fill="#5A6478" text-anchor="middle">问题文本 + 上下文定位</text>
    <text x="650" y="433" fill="#5A6478" text-anchor="middle">Redis(会话缓存)</text>
    <text x="900" y="433" fill="#1E6FE0" text-anchor="middle">AI问答引擎</text>
    <rect x="55" y="449" width="1170" height="34" fill="#FFFFFF"/>
    <text x="150" y="470" fill="#1D2433" text-anchor="middle">问答完成</text>
    <text x="380" y="470" fill="#5A6478" text-anchor="middle">回答文本 + 理解程度 + 续接位置</text>
    <text x="650" y="470" fill="#5A6478" text-anchor="middle">PostgreSQL</text>
    <text x="900" y="470" fill="#1E6FE0" text-anchor="middle">学生前端(SSE流式)</text>
    <rect x="55" y="486" width="1170" height="34" fill="#F4F7FC"/>
    <text x="150" y="507" fill="#1D2433" text-anchor="middle">学情回传</text>
    <text x="380" y="507" fill="#5A6478" text-anchor="middle">掌握度 + 提问统计 + 卡点分布</text>
    <text x="650" y="507" fill="#5A6478" text-anchor="middle">PostgreSQL</text>
    <text x="900" y="507" fill="#1E6FE0" text-anchor="middle">教师学情看板</text>
  </g>

  <rect x="55" y="690" width="1170" height="1" fill="#D0D7E2"/>
  <text x="55" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#9AA3B5">泛雅 AI 互动智课系统</text>
