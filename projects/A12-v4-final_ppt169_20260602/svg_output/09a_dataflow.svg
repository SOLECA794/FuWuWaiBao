    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E6FE0"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
