    <text x="1022" y="651" class="rowBody">提问围绕正在看的内容</text>
    <rect x="872" y="676" width="272" height="42" rx="18" fill="#f4f8ff" stroke="#d7e2f4"/>
    <text x="890" y="703" class="rowTitle">理解判断</text>
