  </g>

  <text x="72" y="164" class="cardTitle">一套底座，两端分工</text>
  <text x="72" y="194" class="cardSub">这一页强调的不是“系统有多少功能”，而是“教师端和学生端如何围绕同一套节点语言协作”</text>

