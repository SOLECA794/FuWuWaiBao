    <rect x="106" y="728" width="272" height="42" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="124" y="755" class="rowTitle">脚本生成</text>
    <text x="250" y="755" class="rowBody">形成开场白 / 讲解 / 过渡语</text>

