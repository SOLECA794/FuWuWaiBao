    <rect x="872" y="728" width="272" height="42" rx="18" fill="#f4f8ff" stroke="#d7e2f4"/>
    <text x="890" y="755" class="rowTitle">续接策略</text>
    <text x="1022" y="755" class="rowBody">补讲 / 重讲 / 继续推进</text>

    <rect x="1182" y="624" width="304" height="42" rx="18" fill="#eef5ff" stroke="#d7e2f4"/>
    <text x="1202" y="651" class="note">系统接住断点，学习不被打断。</text>
    <rect x="1182" y="676" width="304" height="42" rx="18" fill="#eef5ff" stroke="#d7e2f4"/>
    <text x="1202" y="703" class="note">回答要回链到具体节点和当前页。</text>
    <rect x="1182" y="728" width="304" height="42" rx="18" fill="#eef5ff" stroke="#d7e2f4"/>
    <text x="1202" y="755" class="note">提问、理解、续接构成学生侧闭环。</text>
