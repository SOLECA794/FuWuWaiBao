    <text x="790" y="260" class="main">节点化底座</text>
    <text x="1090" y="260" class="main">双端协作</text>
    <text x="1344" y="260" class="main">学习闭环</text>
    <text x="188" y="318" class="sub">讲授 / 问答 / 续接</text>
    <text x="508" y="318" class="sub">把题目翻译成内容结构</text>
    <text x="796" y="318" class="sub">统一内容、上下文、状态</text>
    <text x="1093" y="318" class="sub">教师端生成，学生端续学</text>
    <text x="1332" y="318" class="sub">最终回到教学闭环</text>
  </g>

  <g filter="url(#shadow)">
