    <rect x="416" y="676" width="304" height="42" rx="18" fill="#fff7ec" stroke="#efd7b5"/>
    <text x="436" y="703" class="note">开场白 / 讲解 / 过渡语 / 播放时长</text>
    <rect x="416" y="728" width="304" height="42" rx="18" fill="#fff7ec" stroke="#efd7b5"/>
    <text x="436" y="755" class="note">AI 生成，教师把控节奏和最终呈现</text>

