<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#edf2ff" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="stepRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd9e1"/>
      <stop offset="100%" stop-color="#ffeff3"/>
    </linearGradient>
    <linearGradient id="stepBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e5ff"/>
      <stop offset="100%" stop-color="#f1f6ff"/>
    </linearGradient>
    <linearGradient id="stepGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff6e8"/>
      <stop offset="100%" stop-color="#f4fff8"/>
    </linearGradient>
    <linearGradient id="stepAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8c9"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7a85bf" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#9ba5c6"/>
    </marker>
  </defs>
  <style><![CDATA[
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    .title { font-size: 54px; font-weight: 800; fill: #6672e1; letter-spacing: 1px; }
    .subtitle { font-size: 18px; fill: #65748f; }
    .tab { font-size: 24px; font-weight: 800; fill: #6e76c4; }
    .tab-active { fill: #ffffff; }
    .flowLabel { font-size: 20px; font-weight: 800; fill: #24344d; }
    .flowSub { font-size: 15px; fill: #6b7892; }
    .cardTitle { font-size: 26px; font-weight: 800; fill: #26334b; }
    .cardSub { font-size: 16px; fill: #60708f; }
    .rowTitle { font-size: 18px; font-weight: 800; fill: #2f3b52; }
    .rowBody { font-size: 16px; fill: #55667f; }
    .note { font-size: 17px; fill: #4b5a76; }
    .muted { fill: #75839f; }
    .chip { font-size: 16px; font-weight: 700; fill: #43536f; }
    .summary { font-size: 22px; font-weight: 800; fill: #36415a; }
  ]]></style>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="170" fill="#dbe6ff" opacity="0.38"/>
  <circle cx="120" cy="820" r="220" fill="#e6f5ff" opacity="0.34"/>
  <rect x="22" y="18" width="1556" height="100" rx="18" fill="url(#header)"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#aeb9ef" stroke-width="2" opacity="0.55"/>

  <g transform="translate(44,31)">
    <rect x="2" y="24" width="64" height="50" rx="10" fill="#d9ecff" stroke="#2c7fb8" stroke-width="4"/>
    <path d="M10 35 Q34 20 58 35" fill="none" stroke="#2c7fb8" stroke-width="4"/>
    <path d="M10 46 Q34 31 58 46" fill="none" stroke="#2c7fb8" stroke-width="4"/>
    <circle cx="34" cy="10" r="10" fill="#ffd54f" stroke="#e0a800" stroke-width="3"/>
    <path d="M34 0 L34 5" stroke="#2c7fb8" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 8 L17 4" stroke="#2c7fb8" stroke-width="4" stroke-linecap="round"/>
    <path d="M46 8 L51 4" stroke="#2c7fb8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="136" y="76" class="title">题目需求和内容梳理</text>

  <g>
    <rect x="560" y="36" width="162" height="48" rx="24" fill="#d8dcfa"/>
    <text x="601" y="68" class="tab">项目背景</text>
    <rect x="750" y="36" width="162" height="48" rx="24" fill="#5f6bd8"/>
    <text x="791" y="68" class="tab tab-active">项目方案</text>
    <rect x="940" y="36" width="162" height="48" rx="24" fill="#d8dcfa"/>
    <text x="981" y="68" class="tab">系统原型</text>
    <rect x="1130" y="36" width="162" height="48" rx="24" fill="#d8dcfa"/>
    <text x="1171" y="68" class="tab">项目管理</text>
  </g>

  <text x="72" y="166" class="cardTitle">先把题目要求翻译成内容结构</text>
  <text x="72" y="196" class="cardSub">这一页不直接讲功能，而是把背景、痛点和方案入口的边界先划清楚</text>

  <g filter="url(#shadow)">
    <rect x="72" y="248" width="1456" height="102" rx="28" fill="#ffffff" stroke="#d9def4" stroke-width="2"/>
    <line x1="150" y1="299" x2="1450" y2="299" stroke="#d6dcec" stroke-width="4"/>
    <line x1="150" y1="299" x2="1450" y2="299" stroke="#aab3d3" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="228" cy="299" r="22" fill="url(#stepRose)" stroke="#efbcc7" stroke-width="2"/>
    <circle cx="590" cy="299" r="22" fill="url(#stepBlue)" stroke="#c5d4f2" stroke-width="2"/>
    <circle cx="952" cy="299" r="22" fill="url(#stepGreen)" stroke="#c2e5d0" stroke-width="2"/>
    <circle cx="1314" cy="299" r="22" fill="url(#stepAmber)" stroke="#efd7b5" stroke-width="2"/>
    <text x="220" y="307" class="flowLabel">1</text>
    <text x="582" y="307" class="flowLabel">2</text>
    <text x="944" y="307" class="flowLabel">3</text>
    <text x="1306" y="307" class="flowLabel">4</text>
    <text x="181" y="278" class="flowLabel">题目要求</text>
    <text x="542" y="278" class="flowLabel">角色需求</text>
    <text x="905" y="278" class="flowLabel">内容问题</text>
    <text x="1269" y="278" class="flowLabel">方案入口</text>
    <text x="180" y="329" class="flowSub">讲授 / 问答 / 续接</text>
    <text x="550" y="329" class="flowSub">教师 / 学生</text>
    <text x="872" y="329" class="flowSub">静态 / 断点 / 无底座</text>
    <text x="1239" y="329" class="flowSub">内容梳理 / 双端协作</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="370" width="338" height="302" rx="24" fill="#ffffff" stroke="#efc6d0" stroke-width="2"/>
    <rect x="434" y="370" width="338" height="302" rx="24" fill="#ffffff" stroke="#c8d7f4" stroke-width="2"/>
    <rect x="796" y="370" width="338" height="302" rx="24" fill="#ffffff" stroke="#c7e8d4" stroke-width="2"/>
    <rect x="1158" y="370" width="338" height="302" rx="24" fill="#ffffff" stroke="#efdfc5" stroke-width="2"/>
    <rect x="72" y="370" width="338" height="10" rx="5" fill="#f39fb0"/>
    <rect x="434" y="370" width="338" height="10" rx="5" fill="#7e9ef0"/>
    <rect x="796" y="370" width="338" height="10" rx="5" fill="#72c99a"/>
    <rect x="1158" y="370" width="338" height="10" rx="5" fill="#e0b15f"/>

    <circle cx="106" cy="414" r="18" fill="url(#stepRose)" stroke="#efbcc7" stroke-width="2"/>
    <text x="100" y="420" class="chip">1</text>
    <text x="136" y="421" class="cardTitle">题目要求</text>
    <text x="136" y="448" class="cardSub">讲授 / 实时问答 / 进度续接</text>
    <rect x="100" y="470" width="282" height="42" rx="18" fill="#fff6f8" stroke="#f3d8df"/>
    <text x="116" y="497" class="rowTitle">课件讲解</text>
    <text x="216" y="497" class="rowBody">把静态课件讲成连续内容</text>
    <rect x="100" y="522" width="282" height="42" rx="18" fill="#fff6f8" stroke="#f3d8df"/>
    <text x="116" y="549" class="rowTitle">实时问答</text>
    <text x="216" y="549" class="rowBody">围绕当前页即时回应问题</text>
    <rect x="100" y="574" width="282" height="42" rx="18" fill="#fff6f8" stroke="#f3d8df"/>
    <text x="116" y="601" class="rowTitle">进度续接</text>
    <text x="216" y="601" class="rowBody">打断后还能继续往下讲</text>
    <rect x="96" y="626" width="290" height="32" rx="16" fill="#ffeef2"/>
    <text x="116" y="647" class="note">这三项不是独立功能，而是一条教学链路的三个环节。</text>

    <circle cx="468" cy="414" r="18" fill="url(#stepBlue)" stroke="#c5d4f2" stroke-width="2"/>
    <text x="462" y="420" class="chip">2</text>
    <text x="498" y="421" class="cardTitle">教师 / 学生需求</text>
    <text x="498" y="448" class="cardSub">同一份内容，分别服务讲授和自学</text>
    <rect x="458" y="470" width="262" height="74" rx="18" fill="#f4f8ff" stroke="#d7e2f4"/>
    <text x="478" y="500" class="rowTitle">教师端</text>
    <text x="478" y="526" class="rowBody">讲得快 · 改得动 · 看得见学情</text>
    <rect x="458" y="554" width="262" height="74" rx="18" fill="#f4f8ff" stroke="#d7e2f4"/>
    <text x="478" y="584" class="rowTitle">学生端</text>
    <text x="478" y="610" class="rowBody">问得上 · 接得住 · 回得了当前位置</text>
    <rect x="458" y="640" width="262" height="22" rx="11" fill="#eaf1ff"/>
    <text x="492" y="656" class="note">角色不同，目标不同，但共享同一内容底座。</text>

    <circle cx="830" cy="414" r="18" fill="url(#stepGreen)" stroke="#c2e5d0" stroke-width="2"/>
    <text x="824" y="420" class="chip">3</text>
    <text x="860" y="421" class="cardTitle">内容问题</text>
    <text x="860" y="448" class="cardSub">静态课件不能直接满足上面的需求</text>
    <rect x="820" y="470" width="282" height="54" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="840" y="500" class="rowTitle">静态</text>
    <text x="900" y="500" class="rowBody">课件能展示，但不能直接讲</text>
    <rect x="820" y="532" width="282" height="54" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="840" y="562" class="rowTitle">碎片</text>
    <text x="900" y="562" class="rowBody">知识点分散，节点不清</text>
    <rect x="820" y="594" width="282" height="54" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="840" y="624" class="rowTitle">断点</text>
    <text x="900" y="624" class="rowBody">卡住后很难顺着上下文续上</text>
    <rect x="816" y="656" width="290" height="18" rx="9" fill="#e5f7ec"/>
    <text x="836" y="669" class="note">问题本质：内容还没有被梳理成可讲的结构。</text>

    <circle cx="1192" cy="414" r="18" fill="url(#stepAmber)" stroke="#efd7b5" stroke-width="2"/>
    <text x="1186" y="420" class="chip">4</text>
    <text x="1222" y="421" class="cardTitle">方案入口</text>
    <text x="1222" y="448" class="cardSub">先做内容梳理，再进入双端方案</text>
    <rect x="1180" y="470" width="282" height="54" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="1200" y="500" class="rowTitle">内容梳理</text>
    <text x="1300" y="500" class="rowBody">把题目要求转成可执行需求</text>
    <rect x="1180" y="532" width="282" height="54" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="1200" y="562" class="rowTitle">节点化底座</text>
    <text x="1300" y="562" class="rowBody">统一讲授 / 问答 / 续接的上下文</text>
    <rect x="1180" y="594" width="282" height="54" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="1200" y="624" class="rowTitle">双端协作</text>
    <text x="1300" y="624" class="rowBody">教师端生成，学生端续学</text>
    <rect x="1176" y="656" width="290" height="18" rx="9" fill="#fff0d7"/>
    <text x="1194" y="669" class="note">入口不是结果预览，而是方案设计的起点。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="714" width="1456" height="98" rx="24" fill="#ffffff" stroke="#d9def4" stroke-width="2"/>
    <rect x="94" y="734" width="442" height="58" rx="18" fill="#f6f8ff" stroke="#d7e2f4" stroke-width="1.5"/>
    <rect x="579" y="734" width="442" height="58" rx="18" fill="#f5fbff" stroke="#c8d7f4" stroke-width="1.5"/>
    <rect x="1064" y="734" width="442" height="58" rx="18" fill="#f5fff8" stroke="#c7e8d4" stroke-width="1.5"/>
  </g>
  <text x="118" y="756" class="summary">L1 宏观抽象层</text>
  <text x="118" y="781" class="note">题目要求：讲授 / 问答 / 续接</text>
  <text x="603" y="756" class="summary">L2 中观抽象层</text>
  <text x="603" y="781" class="note">教师 / 学生需求：一套底座两端分工</text>
  <text x="1088" y="756" class="summary">L3 微观抽象层</text>
  <text x="1088" y="781" class="note">内容问题 / 方案入口：先做内容梳理</text>
  <text x="1298" y="804" class="note muted">30秒看懂边界，2分钟看懂拆解。</text>
</svg>