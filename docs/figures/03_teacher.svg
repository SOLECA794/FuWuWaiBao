<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#edf2ff" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8c9"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e5ff"/>
      <stop offset="100%" stop-color="#f1f6ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf5e7"/>
      <stop offset="100%" stop-color="#f3fff8"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd9e1"/>
      <stop offset="100%" stop-color="#ffeff3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7a85bf" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#9ba5c6"/>
    </marker>
  </defs>
  <style><![CDATA[
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    .title { font-size: 48px; font-weight: 800; fill: #6672e1; letter-spacing: 1px; }
    .tab { font-size: 24px; font-weight: 800; fill: #6e76c4; }
    .tab-active { fill: #ffffff; }
    .cardTitle { font-size: 24px; font-weight: 800; fill: #26334b; }
    .cardSub { font-size: 16px; fill: #60708f; }
    .main { font-size: 22px; font-weight: 800; fill: #24344d; }
    .rowTitle { font-size: 18px; font-weight: 800; fill: #2f3b52; }
    .rowBody { font-size: 16px; fill: #55667f; }
    .note { font-size: 17px; fill: #4b5a76; }
    .muted { fill: #75839f; }
    .chip { font-size: 16px; font-weight: 700; fill: #43536f; }
    .summary { font-size: 22px; font-weight: 800; fill: #36415a; }
  ]]></style>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1440" cy="100" r="160" fill="#dbe6ff" opacity="0.34"/>
  <circle cx="122" cy="808" r="230" fill="#e7f6ff" opacity="0.34"/>
  <rect x="22" y="18" width="1556" height="100" rx="18" fill="url(#header)"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#aeb9ef" stroke-width="2" opacity="0.55"/>

  <g transform="translate(44,31)">
    <rect x="2" y="24" width="64" height="50" rx="10" fill="#d9ecff" stroke="#2c7fb8" stroke-width="4"/>
    <path d="M10 35 Q34 20 58 35" fill="none" stroke="#2c7fb8" stroke-width="4"/>
    <path d="M10 46 Q34 31 58 46" fill="none" stroke="#2c7fb8" stroke-width="4"/>
    <circle cx="34" cy="10" r="10" fill="#ffd54f" stroke="#e0a800" stroke-width="3"/>
    <path d="M34 0 L34 5" stroke="#2c7fb8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="136" y="76" class="title">教师端：讲授内容</text>

  <g>
    <rect x="560" y="36" width="162" height="48" rx="24" fill="#d8dcfa"/>
    <text x="601" y="68" class="tab">项目背景</text>
    <rect x="750" y="36" width="162" height="48" rx="24" fill="#5f6bd8"/>
    <text x="791" y="68" class="tab tab-active">项目方案</text>
    <rect x="940" y="36" width="162" height="48" rx="24" fill="#d8dcfa"/>
    <text x="981" y="68" class="tab">系统原型</text>
    <rect x="1130" y="36" width="162" height="48" rx="24" fill="#d8dcfa"/>
    <text x="1171" y="68" class="tab">项目管理</text>
  </g>

  <text x="72" y="164" class="cardTitle">为什么需要教师端</text>
  <text x="72" y="194" class="cardSub">不是为了生成一段长文本，而是为了把内容整理成可讲结构</text>

  <g filter="url(#shadow)">
    <rect x="72" y="234" width="1456" height="106" rx="28" fill="#ffffff" stroke="#d9def4" stroke-width="2"/>
    <line x1="146" y1="286" x2="1452" y2="286" stroke="#d9deee" stroke-width="4"/>
    <line x1="146" y1="286" x2="1452" y2="286" stroke="#aab3d3" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="180" cy="286" r="18" fill="url(#amber)" stroke="#efd7b5" stroke-width="2"/>
    <circle cx="460" cy="286" r="18" fill="url(#blue)" stroke="#c5d4f2" stroke-width="2"/>
    <circle cx="740" cy="286" r="18" fill="url(#green)" stroke="#c2e5d0" stroke-width="2"/>
    <circle cx="1020" cy="286" r="18" fill="url(#rose)" stroke="#efbcc7" stroke-width="2"/>
    <circle cx="1300" cy="286" r="18" fill="#ffffff" stroke="#cfd6ea" stroke-width="2"/>
    <text x="174" y="292" class="chip">1</text>
    <text x="454" y="292" class="chip">2</text>
    <text x="734" y="292" class="chip">3</text>
    <text x="1014" y="292" class="chip">4</text>
    <text x="1294" y="292" class="chip">5</text>
    <text x="138" y="258" class="main">原始课件</text>
    <text x="413" y="258" class="main">页级摘要</text>
    <text x="689" y="258" class="main">节点聚合</text>
    <text x="955" y="258" class="main">脚本生成</text>
    <text x="1238" y="258" class="main">课程发布</text>
    <text x="122" y="322" class="cardSub">PPT / PDF</text>
    <text x="390" y="322" class="cardSub">先压缩单页信息</text>
    <text x="655" y="322" class="cardSub">把跨页知识点串起来</text>
    <text x="935" y="322" class="cardSub">开场白 / 讲解 / 过渡语</text>
    <text x="1190" y="322" class="cardSub">可播、可改、可复用</text>
    <rect x="883" y="334" width="254" height="18" rx="9" fill="#eaf1ff"/>
    <text x="926" y="347" class="note">教师校准：节奏、语气、重点</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="374" width="360" height="302" rx="26" fill="#ffffff" stroke="#efdfc5" stroke-width="2"/>
    <rect x="458" y="374" width="684" height="302" rx="26" fill="#ffffff" stroke="#c8d7f4" stroke-width="2"/>
    <rect x="1168" y="374" width="360" height="302" rx="26" fill="#ffffff" stroke="#c2e5d0" stroke-width="2"/>
    <rect x="72" y="374" width="360" height="10" rx="5" fill="#e0b15f"/>
    <rect x="458" y="374" width="684" height="10" rx="5" fill="#7e9ef0"/>
    <rect x="1168" y="374" width="360" height="10" rx="5" fill="#72c99a"/>

    <circle cx="106" cy="418" r="18" fill="url(#amber)" stroke="#efd7b5" stroke-width="2"/>
    <text x="100" y="424" class="chip">P</text>
    <text x="136" y="425" class="cardTitle">痛点</text>
    <text x="136" y="452" class="cardSub">教师端解决的问题</text>

    <rect x="100" y="478" width="300" height="46" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="118" y="506" class="rowTitle">讲稿组织成本高</text>
    <text x="236" y="506" class="rowBody">每页内容零散，手工整理耗时</text>
    <rect x="100" y="534" width="300" height="46" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="118" y="562" class="rowTitle">讲授节奏难统一</text>
    <text x="236" y="562" class="rowBody">不同老师风格不同，难以复用</text>
    <rect x="100" y="590" width="300" height="46" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="118" y="618" class="rowTitle">学情掌握不完整</text>
    <text x="236" y="618" class="rowBody">教师看不到学生的实际断点</text>
    <rect x="98" y="648" width="304" height="20" rx="10" fill="#fff0d9"/>
    <text x="118" y="662" class="note">教师端的价值不是替代教师，而是标准化前置整理。</text>

    <circle cx="494" cy="418" r="18" fill="url(#blue)" stroke="#c5d4f2" stroke-width="2"/>
    <text x="488" y="424" class="chip">G</text>
    <text x="524" y="425" class="cardTitle">处理链</text>
    <text x="524" y="452" class="cardSub">页级摘要 → 节点聚合 → 脚本生成 → 教师校准</text>

    <rect x="500" y="480" width="128" height="82" rx="18" fill="#f4f8ff" stroke="#d7e2f4"/>
    <text x="524" y="512" class="rowTitle">页级摘要</text>
    <text x="516" y="540" class="rowBody">压缩单页信息</text>
    <line x1="628" y1="521" x2="650" y2="521" stroke="#b9c0db" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="652" y="480" width="128" height="82" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="676" y="512" class="rowTitle">节点聚合</text>
    <text x="668" y="540" class="rowBody">组织跨页关系</text>
    <line x1="780" y1="521" x2="802" y2="521" stroke="#b9c0db" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="804" y="480" width="128" height="82" rx="18" fill="#fffaf2" stroke="#f0dfc0"/>
    <text x="828" y="512" class="rowTitle">脚本生成</text>
    <text x="820" y="540" class="rowBody">形成讲授骨架</text>
    <line x1="932" y1="521" x2="954" y2="521" stroke="#b9c0db" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="956" y="480" width="128" height="82" rx="18" fill="#fff6f8" stroke="#f3d8df"/>
    <text x="980" y="512" class="rowTitle">教师校准</text>
    <text x="972" y="540" class="rowBody">调节节奏与重点</text>

    <rect x="500" y="596" width="528" height="42" rx="18" fill="#eef4ff" stroke="#d7e2f4"/>
    <text x="526" y="623" class="note">节点化脚本 = 开场白 + 讲解 + 过渡语 + 时长</text>
    <rect x="500" y="648" width="528" height="20" rx="10" fill="#e4eeff"/>
    <text x="526" y="662" class="note">AI 负责结构化，教师负责最后把关。</text>

    <circle cx="1194" cy="418" r="18" fill="url(#green)" stroke="#c2e5d0" stroke-width="2"/>
    <text x="1188" y="424" class="chip">O</text>
    <text x="1224" y="425" class="cardTitle">最终输出</text>
    <text x="1224" y="452" class="cardSub">可讲 / 可改 / 可发布</text>

    <rect x="1186" y="478" width="300" height="46" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="1204" y="506" class="rowTitle">讲授脚本</text>
    <text x="1302" y="506" class="rowBody">可直接播讲</text>
    <rect x="1186" y="534" width="300" height="46" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="1204" y="562" class="rowTitle">教师可编辑</text>
    <text x="1302" y="562" class="rowBody">按课程风格微调</text>
    <rect x="1186" y="590" width="300" height="46" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="1204" y="618" class="rowTitle">语音 / 数字人</text>
    <text x="1302" y="618" class="rowBody">支撑自动播报</text>
    <rect x="1186" y="646" width="300" height="46" rx="18" fill="#f4fff8" stroke="#d9efe1"/>
    <text x="1204" y="674" class="rowTitle">课程发布</text>
    <text x="1302" y="674" class="rowBody">变成可复用资源</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="806" width="1456" height="60" rx="20" fill="#ffffff" stroke="#d9def4" stroke-width="2"/>
  </g>
  <text x="100" y="844" class="summary">教师端解决的问题：静态课件不好直接讲；讲稿整理成本高；讲授内容需要可控、可改、可复用。</text>
  <text x="1080" y="844" class="note muted">量化反馈：提问 / 笔记 / 正确率 / 重讲率 / 7日趋势。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="706" width="1456" height="88" rx="22" fill="#ffffff" stroke="#d9def4" stroke-width="2"/>
    <rect x="96" y="724" width="448" height="50" rx="16" fill="#f6f8ff" stroke="#d7e2f4" stroke-width="1.5"/>
    <rect x="576" y="724" width="448" height="50" rx="16" fill="#f5fbff" stroke="#c8d7f4" stroke-width="1.5"/>
    <rect x="1056" y="724" width="448" height="50" rx="16" fill="#f5fff8" stroke="#c7e8d4" stroke-width="1.5"/>
  </g>
  <text x="120" y="748" class="summary">理论</text>
  <text x="120" y="772" class="note">页级摘要把文件压成知识节点</text>
  <text x="600" y="748" class="summary">公式</text>
  <text x="600" y="772" class="note">脚本 = Σ(页级摘要 × 节点聚合) + 教师校准</text>
  <text x="1080" y="748" class="summary">示例</text>
  <text x="1080" y="772" class="note">3类输入 → 4段输出 → 1份可编辑脚本</text>
  <text x="1080" y="796" class="note muted">量化节点：current_page / resume_sec / understanding_level</text>
</svg>