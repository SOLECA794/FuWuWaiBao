<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案设计图预览</title>
  <style>
    body {
      margin: 0;
      background: #eef3fb;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 24px;
      box-sizing: border-box;
    }
    .panel {
      background: #fff;
      border: 1px solid #d9def4;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(76, 88, 146, 0.08);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 16px 20px 10px;
      font-size: 18px;
      color: #3f4e78;
      background: linear-gradient(90deg, #f6f8ff, #ffffff);
      border-bottom: 1px solid #e6ebfb;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2>01_requirements.svg</h2>
      <img src="./01_requirements.svg" alt="题目需求和内容梳理" />
    </div>
    <div class="panel">
      <h2>02_overview.svg</h2>
      <img src="./02_overview.svg" alt="双端解决方案总览" />
    </div>
    <div class="panel">
      <h2>03_teacher.svg</h2>
      <img src="./03_teacher.svg" alt="教师端方案" />
    </div>
    <div class="panel">
      <h2>04_student.svg</h2>
      <img src="./04_student.svg" alt="学生端方案" />
    </div>
  </div>
</body>
</html>
